cards:
  - id: "premortem"
    title: "事前验尸排雷"
    dimension: "critique"
    intent: "批判排雷 / 方案评估"
    mode: "append"
    prompt: "\n\n请用事前验尸（Pre-mortem）视角：假设这个方案半年后彻底失败了，反推最致命的 3 个漏洞，并给出最低成本的验证方法。"

  - id: "clarify_first"
    title: "先反问我 3 个问题"
    dimension: "explore"
    intent: "需求模糊 / 思路发散"
    mode: "append"
    prompt: "\n\n先不要急着给完整方案。请先找出我描述中缺失的关键信息，向我提出 3 个最核心的澄清问题。"

  - id: "de_ai_rewrite"
    title: "去 AI 味极简重写"
    dimension: "polish"
    intent: "文字润色 / 邮件消息"
    mode: "wrap"
    prompt: "请将以下内容重写得更自然、精炼、像真人在日常沟通，去掉所有套话和过度修饰，保留核心事实：\n\n{{input}}"

  - id: "mece_breakdown"
    title: "MECE 结构化拆解"
    dimension: "structure"
    intent: "分析拆解 / 制定计划"
    mode: "append"
    prompt: "\n\n请按 MECE（不重不漏）原则将这件事拆解为 3-5 个核心模块，并为每个模块给出第一步最小可执行动作。"

  - id: "red_team"
    title: "红队反方拷问"
    dimension: "critique"
    intent: "决策验证 / 寻找盲区"
    mode: "append"
    prompt: "\n\n请扮演最挑剔的反对者（红队），不要附和，直接逐条攻击我上述想法中最脆弱的 3 个核心假设。"

  - id: "decision_matrix"
    title: "多维对比决策表"
    dimension: "structure"
    intent: "技术选型 / 方案取舍"
    mode: "append"
    prompt: "\n\n请提取最关键的 4-5 个评估维度，输出一份 Markdown 对比表格，并在最后给出明确的推荐结论与取舍理由。"

  - id: "code_review"
    title: "架构师 Code Review"
    dimension: "engineering"
    intent: "代码审查 / 重构优化"
    mode: "wrap"
    prompt: "请作为资深架构师审查以下代码。忽略代码风格和命名吹毛求疵，只指出潜在 Bug、边界/并发风险以及可简化的复杂度：\n\n{{input}}"

  - id: "root_cause"
    title: "根因定位与排障"
    dimension: "engineering"
    intent: "报错调试 / 故障排查"
    mode: "append"
    prompt: "\n\n请按发生概率从高到低，先列出最可能的 3 个根因，并针对每个根因给出一条最小验证命令或排查步骤。"
