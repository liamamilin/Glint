[project]
name = "glint-brain-server"
version = "0.1.0"
description = "Glint local semantic router backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
