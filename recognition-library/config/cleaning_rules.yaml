version: "2.0"

# L2 草稿 -> L3 生产透镜 确定性清洗与转换规则（零 LLM 成本，随时秒级全量重跑）

# 跨源语义查重时，高优先级来源保留，低优先级重复卡入隔离区
source_priority:
  glint-core: 100
  discovery-taxonomy: 80
  prompt-taxonomy: 70
  super-individual-toolbox: 60
  atlas-methods: 50

# 质量门禁阈值
semantic_dedup_threshold: 0.88
min_confidence: 0.60
min_trigger_utterances: 2
title_max_chars: 18
tagline_max_chars: 64

# 标题首尾冗余标点/编号清洗
title_strip_chars: " 。，、；：！？!?:;\"'“”‘’()（）[]【】-—·•"

# 痛点/摘要中的元描述套话前缀（自动剥离，避免污染 bge-m3 向量空间）
meta_boilerplate_prefixes:
  - "^这是一[个套张份项条](?:用于|用来|针对)?(?:的)?(?:提示词|模板|工具|框架|卡片|方法)[，,：:。\\s]*"
  - "^(?:该|本)(?:提示词|模板|工具|框架|卡片|方法)(?:用于|用来|旨在|可以帮[助你]?)[，,：:。\\s]*"

# 中文方括号变量提取正则（如 Prompt-taxonomy 中的 【问题】【受众】）
chinese_variable_pattern: "【([^【】\\n]{1,24})】"

# 执行面人称与衔接语境清洗（消除第三人称 System Prompt 拼接割裂感）
execution_person_replacements:
  "请把用户提供的问题与范围": "请基于我上面提到的主题与范围"
  "请把用户提供的": "请基于我上面提供的"
  "把用户提供的": "把我上面提供的"
  "根据用户输入": "根据我上面的内容"
  "针对用户输入": "针对我上面的内容"
  "用户提供的": "我上面提供的"

# 领域标签归一化映射（去中英混杂与同义词漂移）
