version: "2.3"

# L3 库存 -> L4 上架货架 声明式调度策略（SSOT）
# L4 最终上架集合 =
#   [全部 S 级常青底座 (always_on_tier_s)]
#   ∪ [各主领域按 category_modes 开放的卡片: off | tier_a | all]
#   ∪ [已开启的自定义合集 active_collections]
#   + [单卡 overrides 强制上架]
#   - [单卡 overrides 强制下架 / deprecated]

always_on_tier_s: true

# A 级精品自动判定阈值（满足任一自动归入 A 级，其余归入 B 级长尾）
tier_a_min_confidence: 0.88
tier_a_sources:
  - "glint-core"
  - "super-individual-toolbox"

# 按来源默认下架清单（如 atlas-methods 默认仅进 L3 库存待命，需通过领域/合集或单卡显式上架）
off_shelf_sources:
  - "atlas-methods"

# 各二级领域主类目的 L4 货架模式：
#   off    = 该领域仅保留 S 级常青（非 S 级全部留在 L3 库存）
#   tier_a = 仅上架该领域的 A 级精品（+ S 级）
#   all    = 该领域 A+B 级全量上架 L4
category_modes:
  general: all
  engineering: all
  product_business: all
  writing_comms: all
  personal_career: all
  custom: all

# 用户自定义合集（跨领域场景包，支持一键整包上架 / 撤回 L3）
active_collections: []
collections:
  sample_research_pack:
    name: "专题深度调研包"
    description: "新领域快速摸底、挤泡沫与一手信源追踪组合"
    lens_ids:
      - pt_source_research
      - pt_research_question
      - disc_cognition_separating_signal_from_hype
      - disc_cognition_weak_signal_radar
      - pt_claim_evidence_matrix

# 精选 S 级常青通用底座（永不自动下架）
