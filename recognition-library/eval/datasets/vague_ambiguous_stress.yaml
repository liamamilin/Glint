    expected_ids: ["disc_life_cognitive_bandwidth_hygiene", "pt_sort_out_concern", "sit_os_01", "disc_life_low_friction_joy_menu", "disc_life_physical_reset_rituals", "cle_m2_c_p2_explication"]
    forbidden_ids: ["core_code_review", "pt_debug_error", "sit_ops_01", "pt_sql_query"]
    notes: "精力枯竭与内耗：心理带宽审计/分清事实与下一步/低门槛恢复"

  - id: vague_emo_busy_no_progress
