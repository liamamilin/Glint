version: "1.0"
dataset_name: "vague_ambiguous_stress"
description: "模糊与高歧义问题专项压测集 — 36 条覆盖 6 类真实模糊输入（极短指代、想法发散、情绪混沌、半截输入、纯名词搜索式、抽象大词/伪问题）"

cases:
  # =========================================================================
  # 1. 极短指代 / 缺上下文型 (vague_deictic, 6)
  # =========================================================================
  - id: vague_deictic_fix_it
    bucket: vague_deictic
    difficulty: hard
    app_name: "ChatGPT"
    input_text: "帮我改改"
    expected_primitives: ["translate", "metacognize", "critique"]
    expected_ids: ["pt_rewrite", "core_de_ai_rewrite", "pt_line_edit_markup", "core_clarify_first", "cle_m2_c_c1_specification"]
    forbidden_ids: ["pt_sql_query", "pt_meal_plan", "disc_business_micro_glue", "pt_trip_itinerary"]
    notes: "极短无对象请求：改写润色或先反问澄清，禁止跳无关垂直领域"

  - id: vague_deictic_reasonable
    bucket: vague_deictic
    difficulty: hard
    app_name: "ChatGPT"
    input_text: "这个合理吗"
    expected_primitives: ["critique", "metacognize"]
    expected_ids: ["core_red_team", "pt_fact_check", "cle_m2_c_p20_uncertainty", "cle_m2_c_p19_evidence_linking", "core_clarify_first", "disc_cognition_explicit_assumptions_audit"]
    forbidden_ids: ["pt_meal_plan", "pt_sql_query", "pt_trip_itinerary"]
    notes: "极短合理性追问：审视假设/核查依据/先澄清"

  - id: vague_deictic_analyze
    bucket: vague_deictic
    difficulty: hard
    app_name: "Notion"
    input_text: "帮我分析一下"
    expected_primitives: ["metacognize", "deconstruct", "critique"]
    expected_ids: ["core_clarify_first", "core_mece_breakdown", "cle_m1_r_p7_expansion", "cle_m2_c_p1_focus", "disc_cognition_question_refinement_loop"]
    forbidden_ids: ["pt_meal_plan", "pt_sql_query", "pt_shopping_shortlist"]
    notes: "零背景分析请求：先聚焦/反问或 MECE 结构拆解"

  - id: vague_deictic_feels_off
    bucket: vague_deictic
    difficulty: hard
    app_name: "Obsidian"
    input_text: "有点不对劲"
    expected_primitives: ["metacognize", "critique", "deconstruct"]
    expected_ids: ["cle_m2_c_p2_explication", "cle_m2_c_c4_problem_formation", "core_clarify_first", "core_root_cause", "pt_sort_out_concern"]
    forbidden_ids: ["pt_meal_plan", "pt_draft_email", "pt_shopping_shortlist"]
    notes: "直觉察觉异常但说不清：想法显化/问题定义/先澄清"

  - id: vague_deictic_what_next
    bucket: vague_deictic
    difficulty: hard
    app_name: "Notes"
    input_text: "接下来怎么办"
    expected_primitives: ["metacognize", "deconstruct", "compress"]
    expected_ids: ["core_clarify_first", "pt_sort_out_concern", "cle_m2_c_c13_plan_formation", "disc_life_simplifying_when_overwhelmed", "pt_project_plan"]
    forbidden_ids: ["core_code_review", "pt_sql_query", "pt_meal_plan"]
    notes: "卡住求下一步：先澄清或梳理事实与最小下一步"

  - id: vague_deictic_give_advice
    bucket: vague_deictic
    difficulty: hard
    app_name: "ChatGPT"
    input_text: "给我点建议"
    expected_primitives: ["metacognize", "diverge"]
    expected_ids: ["core_clarify_first", "disc_cognition_question_refinement_loop", "cle_m2_c_p2_explication", "cle_m2_c_c1_specification", "pt_brainstorm"]
    forbidden_ids: ["core_code_review", "pt_sql_query", "pt_meal_plan"]
    notes: "完全空白的求建议：必须先反问澄清或显化意图"

  # =========================================================================
  # 2. 想法发散 / 起点模糊型 (vague_blank_slate, 6)
  # =========================================================================
  - id: vague_blank_side_hustle
    bucket: vague_blank_slate
    difficulty: hard
    app_name: "Obsidian"
    input_text: "想做点副业但不知道做什么好"
    expected_primitives: ["metacognize", "diverge", "deconstruct"]
    expected_ids: ["core_clarify_first", "disc_career_portfolio_of_small_bets", "disc_career_reversible_career_probes", "disc_business_niching_down_by_specific_user", "cle_m2_c_p16_desired_state", "disc_cognition_question_refinement_loop"]
    forbidden_ids: ["core_code_review", "pt_debug_error", "pt_meal_plan"]
    notes: "模糊副业探索：小步试探/收窄切口/先澄清"

  - id: vague_blank_ai_efficiency
    bucket: vague_blank_slate
    difficulty: hard
    app_name: "Notion"
    input_text: "我想用AI提升一下工作效率，但不知道从哪开始"
    expected_primitives: ["metacognize", "deconstruct", "converge"]
    expected_ids: ["core_clarify_first", "disc_cognition_identifying_true_bottleneck", "disc_cognition_question_refinement_loop", "pt_tool_selection", "sit_ops_04", "core_mece_breakdown"]
    forbidden_ids: ["pt_meal_plan", "pt_trip_itinerary", "pt_draft_email"]
    notes: "宽泛提效诉求：先找真瓶颈/先澄清/选对AI能力"

  - id: vague_blank_product_missing
    bucket: vague_blank_slate
    difficulty: hard
    app_name: "Notion"
    input_text: "感觉我这个产品缺了点什么，又说不上来"
    expected_primitives: ["metacognize", "critique", "deconstruct"]
    expected_ids: ["cle_m2_c_p2_explication", "cle_m2_c_c4_problem_formation", "core_clarify_first", "sit_prd_04", "pt_user_journey_map", "sit_cos_01"]
    forbidden_ids: ["pt_meal_plan", "pt_sql_query", "pt_draft_email"]
    notes: "模糊产品体感不满：显化直觉/走查核心路径/红队诊断"

  - id: vague_blank_what_to_write
    bucket: vague_blank_slate
    difficulty: medium
    app_name: "Obsidian"
    input_text: "想写点东西持续输出，又不知道写啥主题"
    expected_primitives: ["deconstruct", "metacognize", "diverge"]
    expected_ids: ["disc_content_collecting_real_questions_from_readers", "core_clarify_first", "disc_content_series_with_clear_arc", "disc_content_field_notes_from_real_runs", "pt_brainstorm"]
    forbidden_ids: ["core_code_review", "pt_debug_error", "pt_sql_query"]
    notes: "无选题方向：从真问题找选题/实验日志/先澄清"

  - id: vague_blank_messy_thoughts
    bucket: vague_blank_slate
    difficulty: medium
    app_name: "Obsidian"
    input_text: "手头一堆想法乱糟糟的，帮我理理头绪"
    expected_primitives: ["deconstruct", "metacognize", "compress"]
    expected_ids: ["core_mece_breakdown", "core_clarify_first", "cle_m2_c_p2_explication", "disc_life_simplifying_when_overwhelmed", "sit_os_01", "cle_m2_c_p1_focus"]
    forbidden_ids: ["core_code_review", "pt_sql_query", "pt_meal_plan"]
    notes: "思绪混乱理头绪：MECE拆解/显化想法/过载减法"

  - id: vague_blank_career_change
    bucket: vague_blank_slate
    difficulty: medium
    app_name: "Notes"
    input_text: "我想转行，但是完全没想好去哪个方向"
    expected_primitives: ["converge", "deconstruct", "metacognize"]
    expected_ids: ["pt_career_options", "disc_career_reversible_career_probes", "core_clarify_first", "cle_m2_c_p17_preference_formation", "disc_life_micro_experiments_lifestyle"]
    forbidden_ids: ["core_code_review", "pt_debug_error", "pt_resume_bullets"]
    notes: "职业方向未定：比较职业方向/可撤回试探/偏好澄清"

  # =========================================================================
  # 3. 情绪夹杂 / 困境混沌型 (vague_emotional_fog, 6)
  # =========================================================================
