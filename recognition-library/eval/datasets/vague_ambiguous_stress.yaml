    expected_ids: ["disc_life_simplifying_when_overwhelmed", "sit_os_01", "pt_prioritize_backlog", "pt_weekly_calendar", "sit_os_04", "cle_m2_c_p15_prioritization"]
    forbidden_ids: ["core_code_review", "pt_debug_error"]
    notes: "优先级过载：过载先做减法/需求优先级/周度清仓"

  # =========================================================================
