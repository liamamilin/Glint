version: "1.0"
dataset_name: "everyday_simulated"
description: "模拟普通人日常输入综合基准集 — 72 条跨 9 大真实场景（学习消化、消费生活、人际情绪、职场求职、写作表达、商业产品、工程编程、极短模糊、边界对抗）"

cases:
  # =========================================================================
  # 1. 日常学习与知识消化 (learning_digest, 8)
  # =========================================================================
  - id: daily_learn_inflation_explain
    bucket: learning_digest
    difficulty: easy
    app_name: "ChatGPT"
    input_text: "帮我解释一下什么是通货膨胀，说人话"
    expected_primitives: ["translate", "deconstruct"]
    expected_ids: ["pt_explain", "sit_os_02", "disc_career_translating_jargon_for_stakeholders"]
    forbidden_ids: ["core_code_review", "pt_debug_error", "disc_business_open_source_funnel"]
    notes: "通俗概念解释，首选例子解释概念或概念记忆编码"

  - id: daily_learn_video_editing_plan
    bucket: learning_digest
    difficulty: medium
    app_name: "Notion"
    input_text: "想从零开始学视频剪辑，每天只有一小时怎么安排"
    expected_primitives: ["deconstruct", "converge"]
    expected_ids: ["pt_study_plan", "disc_career_deliberate_skill_upgrade_sprint", "pt_choose_learning_resource", "pt_project_plan"]
    forbidden_ids: ["pt_video_edit_plan", "core_code_review", "pt_brainstorm"]
    notes: "零基础学习规划（不是具体素材剪辑节奏方案）"

  - id: daily_learn_thick_book_distill
    bucket: learning_digest
    difficulty: easy
    app_name: "Obsidian"
    input_text: "这本专业书太厚了，怎么快速抓住最核心的观点"
    expected_primitives: ["compress", "deconstruct"]
    expected_ids: ["disc_content_distilling_long_reads_into_key_shifts", "pt_summarize", "pt_study_notes", "cle_m1_r_p6_compression"]
    forbidden_ids: ["core_code_review", "pt_draft_email"]
    notes: "长内容提炼核心观点/关键转向"

  - id: daily_learn_concept_confusion
    bucket: learning_digest
    difficulty: medium
    app_name: "ChatGPT"
    input_text: "我老是搞混基金定投和波段操作，怎么确认自己真的懂了"
    expected_primitives: ["metacognize", "translate", "deconstruct"]
    expected_ids: ["pt_check_understanding", "disc_career_teaching_to_cement_mastery", "pt_explain", "cle_m1_r_p2_differentiation", "pt_retrieval_practice"]
    forbidden_ids: ["core_code_review", "pt_debug_error"]
    notes: "概念误解诊断 / 费曼检验 / 概念区分"

  - id: daily_learn_english_vocab
    bucket: learning_digest
    difficulty: easy
    app_name: "Chrome"
    input_text: "把这段英文新闻里最地道的表达挑出来给我练练"
    expected_primitives: ["translate", "deconstruct", "diverge"]
    expected_ids: ["pt_vocabulary_in_context", "pt_reading_graded", "pt_practice_quiz", "pt_flashcards"]
    forbidden_ids: ["core_code_review", "pt_sql_query"]
    notes: "真实语境学高频词组 / 英语学习"

  - id: daily_learn_mistake_review
    bucket: learning_digest
    difficulty: medium
    app_name: "Notes"
    input_text: "考公行测资料分析老是算错，帮我复盘一下错题规律"
    expected_primitives: ["deconstruct", "critique", "metacognize"]
    expected_ids: ["pt_review_mistakes", "disc_career_building_a_personal_error_log", "pt_retrieval_practice"]
    forbidden_ids: ["core_code_review", "pt_debug_error", "pt_ci_failure"]
    notes: "错题模式归因，不要串台到代码排障"

  - id: daily_learn_mini_lesson
    bucket: learning_digest
    difficulty: medium
    app_name: "Notion"
    input_text: "下个月要给小学生讲一节15分钟的航天科普课，帮我设计一下"
    expected_primitives: ["deconstruct", "translate"]
    expected_ids: ["pt_teach_lesson", "pt_slides_outline", "pt_explain"]
    forbidden_ids: ["core_code_review", "pt_api_docs"]
    notes: "设计微型课"

  - id: daily_learn_pdf_evidence
    bucket: learning_digest
    difficulty: easy
    app_name: "Chrome"
    input_text: "这份40页的行业PDF太长了，帮我按页挑出带数据证据的重点"
    expected_primitives: ["compress", "deconstruct", "critique"]
    expected_ids: ["pt_pdf_key_points", "pt_paper_brief", "pt_summarize", "cle_m2_c_p19_evidence_linking"]
    forbidden_ids: ["pt_table_from_pdf", "core_code_review"]
    notes: "按页定位 PDF 重点"

  # =========================================================================
  # 2. 消费、生活与出行决策 (life_daily, 8)
  # =========================================================================
  - id: daily_life_headphone_shopping
