    forbidden_ids: ["pt_project_plan", "core_code_review", "pt_weekly_calendar"]
    notes: "可调整行程规划"

  - id: daily_life_budget_mess
    bucket: life_daily
    difficulty: medium
    app_name: "Notes"
    input_text: "每个月工资一万多不知道花哪去了，想理一下开销做个预算"
    expected_primitives: ["deconstruct", "compress"]
    expected_ids: ["pt_household_budget", "core_mece_breakdown", "pt_explore_data"]
    forbidden_ids: ["sit_leg_02", "disc_business_transparent_simple_pricing", "core_code_review"]
    notes: "家庭预算分类，不要串台到 SaaS 定价"

  - id: daily_life_wifi_troubleshoot
    bucket: life_daily
    difficulty: medium
    app_name: "ChatGPT"
    input_text: "家里WiFi隔一堵墙就老断流，怎么一步步排查原因"
    expected_primitives: ["deconstruct", "critique"]
    expected_ids: ["pt_troubleshoot_everyday", "core_root_cause", "pt_support_troubleshoot"]
    forbidden_ids: ["core_code_review", "pt_ci_failure", "pt_refactor_code"]
    notes: "日常故障排查清单 / 根因排查"

  - id: daily_life_rent_contract
    bucket: life_daily
    difficulty: easy
    app_name: "WeChat"
    input_text: "租房合同里写提前退租扣两个月押金，帮我看看这份合同还有哪些坑"
    expected_primitives: ["critique", "deconstruct"]
    expected_ids: ["sit_leg_01", "pt_compare_policies", "cle_m2_c_p19_evidence_linking"]
    forbidden_ids: ["core_code_review", "pt_draft_email"]
    notes: "合同条款排雷仪"

  - id: daily_life_hospital_prep
    bucket: life_daily
    difficulty: medium
    app_name: "Notes"
    input_text: "明天去医院复查，之前拍过两次片子、吃过三种药，怕见医生说漏了怎么准备"
    expected_primitives: ["deconstruct", "compress"]
    expected_ids: ["pt_appointment_prep", "pt_timeline", "pt_how_to"]
    forbidden_ids: ["pt_meeting_agenda", "core_code_review"]
    notes: "预约前材料整理"

  - id: daily_life_flight_delay
    bucket: life_daily
    difficulty: easy
    app_name: "WeChat"
    input_text: "航班突然取消了，明天下午还有重要会议，帮我重排两套出行方案"
    expected_primitives: ["deconstruct", "converge"]
    expected_ids: ["pt_trip_disruption", "pt_trip_itinerary", "pt_compare_options"]
    forbidden_ids: ["core_code_review", "pt_meeting_agenda"]
    notes: "行程变动替代方案"

  # =========================================================================
  # 3. 人际沟通与情绪压力 (comms_emotion, 8)
