    expected_primitives: ["converge", "critique"]
    expected_ids: ["pt_shopping_shortlist", "core_decision_matrix", "pt_compare_options", "disc_content_opinionated_comparisons"]
    forbidden_ids: ["pt_offer_compare", "core_code_review"]
    notes: "购物候选清单筛选 / 多维对比决策"

  - id: daily_life_fridge_meal
    bucket: life_daily
    difficulty: easy
    app_name: "Notes"
    input_text: "冰箱里只剩两个番茄、三个鸡蛋和半块豆腐，晚上做什么快手菜"
    expected_primitives: ["deconstruct", "translate"]
    expected_ids: ["pt_meal_plan", "pt_recipe_scale"]
    forbidden_ids: ["core_code_review", "pt_brainstorm", "pt_project_plan"]
    notes: "现有食材规划餐食"

  - id: daily_life_chengdu_trip
