execution:
  action_type: open_resource
  inject_mode: null
  content: "GEO/SEO 语义优化清单与可嵌入 <head> 的元数据模板\n\n优化清单：\n1. 为每个核心页面补齐语义标签：Title、Description、Open Graph、JSON-LD 结构化数据\n2. 在正文开头用\
    \ 2–3 句话给出「可直接被 AI 摘录引用」的清晰定义，并附核心对比表\n3. 用真实用户会搜的自然语言问题作为小标题，而非晦涩的内部代号\n4. 提升信息密度与原创结构，避免关键词堆砌\n\n可嵌入 <head> 的元数据模板：\n\
    <title>{{title}}</title>\n<meta name=\"description\" content=\"{{description}}\">\n<meta property=\"og:title\" content=\"\
    {{title}}\">\n<meta property=\"og:description\" content=\"{{description}}\">\n<meta property=\"og:type\" content=\"article\"\
    >\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"TechArticle\",\n\
    \  \"headline\": \"{{title}}\",\n  \"description\": \"{{description}}\"\n}\n</script>\n\n误用警告：不要堆砌关键词写垃圾内容；在大模型检索时代，信息密度与原创结构比词频重要得多。"
  variables:
  - title
  - description
  workflow: null
