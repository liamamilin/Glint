id: pt_difficult_conversation
title: 难开口对话演练
tagline: 把难说的话组织成开场白并模拟对方异议
routing:
  primitive: translate
  goals:
  - create
  clarity_fit:
  - vague
  - concrete
  domains:
  - communication
  - conflict_resolution
  - negotiation
  app_affinity:
  - Slack
  - Feishu
  - WeChat
  - Mail
  pain_point: 用户要跟某人谈一个敏感或冲突话题，但不知如何开口，担心升级或被误解
  trigger_utterances:
  - 怎么跟老板提涨薪
  - 要跟同事谈他总迟到
  - 和伴侣谈边界问题
  - 怎么跟客户说方案要改
  - 和室友谈噪音
  anti_triggers:
  - 日常闲聊或寒暄
  - 写代码或修 bug
execution:
  action_type: inject_prompt
  inject_mode: append
  content: 帮我准备跟【对方及关系】讨论【问题】。按我感受到的影响、对方可能关心的点和希望达成的请求组织开场。扮演对方提出一个具体异议，等我回应后给可执行的反馈。
  variables:
  - 对方及关系
  - 问题
  workflow: null
