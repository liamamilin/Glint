  pain_point: 做中英双语产品、文档或卡片库时，机翻英文僵硬别扭、丢失原本犀利感，且术语译名不统一。
  trigger_utterances:
  - 这个英文翻译太硬了帮我润色一下
  - 中英双语文案怎么翻译得自然点
  - 机翻的英文没内味
