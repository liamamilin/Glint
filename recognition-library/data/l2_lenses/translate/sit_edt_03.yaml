execution:
  action_type: open_resource
  inject_mode: null
  content: '双语地道本地化器


    定位：不是逐字翻译，而是用另一种语言重新表达一遍。


    使用流程：

    1. 提炼意图与语气：让 AI 用一句话概括原句的真实意图与语气色彩（如冷峻、幽默、克制）。

    2. 禁止逐词直译：按目标语言母语习惯重写 2 个版本——标准版 vs. 极简犀利版。

    3. 术语一致性：对照《项目术语表》，确保产品术语与 UI 标签全站译名一致。


    交付物：一组无翻译腔的双语对照文案 + 《项目术语表》（JSON/Markdown）。


    避坑：UI 按钮/短卡片不追求字数对称；英文通常更宽，优先自然简洁。'
