  inject_mode: append
  content: 主持一局【题材和难度】的文字推理游戏，时长约【回合数】。给清楚目标、已知线索和能尝试的行动，等我每轮回答再继续。记录我已经发现的证据。直到我请求揭晓或结束，才说明答案和推理过程。
  variables:
  - 题材和难度
  - 回合数
  workflow: null
