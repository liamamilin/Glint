id: cle_m2_c_p6_similarity_detection
title: 结构相似识别 (C-P6)
tagline: 相似未明确 → 区分表面相似与结构对应，并标明不对应边界
routing:
  primitive: diverge
  goals:
  - digest
  - create
  clarity_fit:
  - concrete
  - vague
  domains:
  - cognition
  - general
  app_affinity: []
  pain_point: 想通过类比借鉴其他案例，但怕被表面相似误导、硬造类比，或误以为相似就意味着底层机制相同
  trigger_utterances:
  - 这两个案例有哪些共同点，哪些部分起到了相近的作用
  - 帮我看看这两个领域是表面像，还是底层结构真的对应
  - 我想借鉴另一个案例的做法，帮我核对哪些对应、哪些不能照搬
  - 对比这两个对象，找出可迁移的同构部分和不对应边界
execution:
  action_type: inject_prompt
  inject_mode: append
  content: '请帮我并列分析以上对象之间的共同特征与结构对应关系：

    1. **特征与作用并列**：分别描述两个对象的关键特征及内部要素之间的联系。

    2. **分层识别相似**：严格分开说明——① 表面特征上的相同点；② 在系统中起相近作用的“结构对应”部分；③ 明确不对应或信息未知的部分。

    3. **限定迁移边界**：指出当前材料只支持到哪一层面的相似，哪些部分**不能**按同一结构照搬处理（找不到对应时直接说明，不强造类比）。


    **检查与边界**：相似本身不证明背后有相同原因或机制；迁移到新情境前仍需另查证据。

    *(向内自问备用句：“这两个对象有哪些共同点，哪些部分起相近作用？”)*'
  variables: []
