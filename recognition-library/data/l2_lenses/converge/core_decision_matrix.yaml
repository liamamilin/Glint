id: core_decision_matrix
title: 多维对比决策表
tagline: 面对多方案取舍，输出对比表与明确推荐
routing:
  primitive: converge
  goals:
  - evaluate
  clarity_fit:
  - vague
  - concrete
  domains:
  - decision_making
  - architecture
  - product_strategy
  app_affinity:
  - Notion
  - Cursor
  - Linear
  - Chrome
  pain_point: 用户面对多个技术方案或选项难以取舍，缺乏结构化对比与明确推荐
  trigger_utterances:
  - 对比选方案
  - A 方案和 B 方案哪个好
  - 这几个框架怎么选
  - 帮我对比一下这几个选项
  - 纠结选 React 还是 Vue
  - 这几个方案各有什么优劣
  anti_triggers:
  - 已经决定好方案只需执行
  - 只需要单一方案的优缺点分析
execution:
  action_type: inject_prompt
  inject_mode: append
  content: 请提取真正拉开差距的 3–5 个关键评估维度，输出紧凑的 Markdown 对比表，并在最后给出明确的推荐结论、取舍理由与翻转条件（什么前提变化时应改选另一项）；若某选项在硬约束上已一票否决，先直接指出淘汰原因，不必强行打满全表。
  variables: []
  workflow: null
