id: disc_cognition_separating_facts_from_stories
title: 事实 vs 脑补拆分
tagline: 把事实和脑补拆开，卡壳少一半
routing:
  primitive: deconstruct
  goals:
  - optimize
  - debug
  clarity_fit:
  - vague
  - conflicted
  domains:
  - cognition
