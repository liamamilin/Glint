execution:
  action_type: show_checklist
  inject_mode: null
  content: '一次性微软件速成规格清单：

    - 明确一次性任务目标、输入数据与期望输出

    - MECE 拆解需要的字段/步骤/校验规则

    - 选定单文件 HTML/JS 技术栈（无依赖或 CDN）

    - 设计极简 UI：输入区、处理按钮、结果区

    - 实现本地运行，数据不上传、不持久化

    - 放弃通用性：不做登录、不做多用户、不做长期维护

    - 10 分钟内生成、运行并验证

    - 用完即弃：任务完成后可直接删除文件'
