title: Vercel 部署路径决策
tagline: 部署前先查状态，再选正确 Vercel 部署路径
routing:
  primitive: deconstruct
  goals:
  - create
  - optimize
  clarity_fit:
  - vague
  - concrete
  domains:
  - deployment
  - vercel
  - cli
