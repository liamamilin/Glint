  content: '【给日程留出缓冲白·排程检查清单】

    1. 盘点一周固定 обязатель（会议/接送/硬截止），标出不可挪动块。

    2. 每天至少留 1 个 30–60 分钟「弹性白块」，不预填任何任务。

    3. 高耗能任务后安排 15 分钟恢复/过渡，不连排。

    4. 重要任务按「理想时长 ×1.5」预估，多出部分即缓冲。

    5. 把突发/杂事统一收进「缓冲白块」处理，而非挤占主线。

    6. 每周复盘：若缓冲总被吃光，下一周减少 1–2 个 commitments。

    7. 预设「崩盘预案」：当日程延误 >30 分钟，自动砍掉最低优先级一项。'
