execution:
  action_type: show_checklist
  inject_mode: null
  content: '极简随手记 + 每周15分钟轻复盘


    每日/随时（不超过3个动作）

    - [ ] 只保留一个捕捉入口，所有想法先丢进去，不分类。

    - [ ] 每条记录只写一句话：发生了什么 / 下一步是什么。

    - [ ] 每周固定15分钟，扫一遍入口并清空。


    每周轻复盘4问（15分钟）

    - [ ] 1. 本周真正推进了什么？

    - [ ] 2. 卡住我的最大障碍是什么？

    - [ ] 3. 哪些事情其实不必做/可以延后？

    - [ ] 4. 下周只选1~2件最重要要事。


    清空规则

    - [ ] 已完成：标记完成或删除。

    - [ ] 可延后：移到下周。

    - [ ] 无行动：直接删除，不保留无用记录。'
