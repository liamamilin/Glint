execution:
  action_type: inject_prompt
  inject_mode: append
  content: 按侦察—行动流程测试本地 Web 应用：1) 先判定页面类型：静态 HTML 直接读取文件提取选择器；动态应用进入侦察—行动流程。2) 动态应用以 headless Chromium 启动，page.goto 后先 wait_for_load_state('networkidle')。3)
    侦察：截图、读取 page.content()、枚举元素，仅从渲染结果识别 text=/role=/CSS/ID 选择器。4) 再执行具体动作，必要时加 wait_for_selector 或 wait_for_timeout。5) 服务器生命周期交由黑盒
    helper 管理：先运行 helper --help，脚本只保留 Playwright 逻辑；多服务器重复 --server/--port。6) 任务完成后始终关闭浏览器。避免在 networkidle 前检查 DOM、未读 HTML
    就假设选择器、过早阅读 helper 源码、非 headless 运行。
  variables: []
  workflow: null
