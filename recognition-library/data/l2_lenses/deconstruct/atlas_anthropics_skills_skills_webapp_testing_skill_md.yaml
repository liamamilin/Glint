  pain_point: 在动态页面还没渲染完成时就基于旧 DOM 操作，或手动折腾本地服务器启停，导致测试脚本反复失败。
  trigger_utterances:
  - 这个页面还没加载完我就点错了
  - 帮我写 Playwright 测试先等 networkidle
  - 本地 web 应用自动化测试脚本老失败
  - 动态页面选择器怎么拿
  - 服务器启动关闭太麻烦
