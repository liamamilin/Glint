execution:
  action_type: show_checklist
  inject_mode: null
  content: '温和晨间黄金时段保护清单：

    1. 起床后先不打开消息/资讯 App，给前 30-60 分钟留作自己的时间。

    2. 只做一件最小、明确、能完成的小事（如写字、阅读、散步、整理当天重点），不追求完美。

    3. 手机保持勿扰或仅允许紧急联系人；消息延后到黄金时段结束后统一处理。

    4. 若被打断，只记录“稍后处理”，不立即进入他人需求。

    5. 结束时用一句话记录：今天最想推进的一件事是什么。

    6. 根据作息类型调整：早起党放晨间，夜猫子放起床后第一段清醒时间，轮班者放班前/班后固定窗口。'
