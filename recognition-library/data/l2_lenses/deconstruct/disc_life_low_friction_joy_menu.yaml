  pain_point: 用户疲惫时只会刷短视频或等假期一次性大放松，越刷越空，没有低成本的及时充电动作。
  trigger_utterances:
  - 好累但又刷手机停不下来
  - 等周末再休息吧
  - 帮我做个恢复清单
  - 最近好 burnout 怎么办
  - 烦躁拖延提不起劲
  anti_triggers:
