id: pt_negotiation_prep
title: 协商准备清单
tagline: 拆出优先事项、交换条件、底线与备选方案
routing:
  primitive: deconstruct
  goals:
  - create
  clarity_fit:
  - concrete
  - conflicted
  domains:
  - communication
  - negotiation
  - stakeholder_management
  - conflict_resolution
  app_affinity:
  - Notion
  - Mail
  - Feishu
  - Slack
  pain_point: 谈事前理不清自己要什么、能给什么、最低接受什么，容易被对方节奏带着走
  trigger_utterances:
  - 下周要和客户谈合同，帮我准备一下
  - 和老板谈预算，我该先说什么
  - 这个合作条件怎么谈，底线在哪
  - 帮我列 negotiation 的优先级和备选方案
  - 谈崩了怎么办，先帮我准备 negotiation
  anti_triggers:
  - 只是润色一封谈判邮件
  - 日常闲聊或非对抗沟通
execution:
  action_type: inject_prompt
  inject_mode: append
  content: 我将就{{topic}}与{{counterpart}}协商，客观约束为{{constraints}}。请帮我准备：1) 我方优先事项与底线；2) 开放问题与需确认信息；3) 可交换条件与让步顺序；4) 无法达成时的备选方案（BATNA）；5)
    一句开场白；6) 一个能测试对方优先级的问题。输出为结构化清单。
  variables:
  - topic
  - counterpart
  - constraints
  workflow: null
