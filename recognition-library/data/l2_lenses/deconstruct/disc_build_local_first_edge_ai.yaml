execution:
  action_type: show_checklist
  inject_mode: null
  content: '本地优先 + 端侧小模型 设计清单


    □ 步骤 1：列出 5 个用户极度在意隐私、不敢上传云端的场景（如医疗/财务/个人日记），为每个场景设计一个完全离线运行、结合端侧小模型的工具。

    □ 步骤 2：在具体场景中，对比云端大模型 API 与本地小模型（Whisper / Moondream / Qwen 小参数版），通过任务拆解让端侧模型达到 90% 可用效果。

    □ 步骤 3：为每个工具标出「必须云端」vs「可端侧」的能力边界与降级策略。

    □ 步骤 4：评估一次性买断定价、离线分发渠道与更新方式。'
