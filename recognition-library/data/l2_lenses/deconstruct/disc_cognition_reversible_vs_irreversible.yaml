execution:
  action_type: show_checklist
  inject_mode: null
  content: '## 可逆门 vs 单向门 自检清单


    ### 第一步：分类本周的纠结

    把正在纠结的事填入 {{three_decisions}}，逐条判断：

    - [ ] 这件事能否在 24h 内回滚或修复？

    - [ ] 最坏情况的修复成本 < 1 天工作量？

    - [ ] 是否只影响自己或小范围？

    若以上多为"是" → 可逆门：先跑最小实验，再迭代。

    若任一项为"否" → 单向门：做足调研再决策。


    ### 第二步：给可逆事定最小行动

    每件可逆事写一个 24h 内能完成的最小动作（原型/小范围试跑/可回滚提交）。


    ### 第三步：压力测试风险

    针对顾虑 {{risk_concern}}：

    - [ ] 最坏情况具体是什么？

    - [ ] 修复/回滚的实际成本（时间/金钱/声誉）？

    - [ ] 是否存在低成本兜底（备份/灰度/可回滚）？

    若修复成本低 → 先行动；若高 → 升级为单向门流程。'
  variables:
  - three_decisions
  - risk_concern
  workflow: null
