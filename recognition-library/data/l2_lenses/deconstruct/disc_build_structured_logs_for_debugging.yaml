id: disc_build_structured_logs_for_debugging
title: 脚本留结构化痕迹
tagline: 出错时1分钟顺藤摸瓜定位根因
routing:
  primitive: deconstruct
  goals:
  - debug
  - optimize
  clarity_fit:
