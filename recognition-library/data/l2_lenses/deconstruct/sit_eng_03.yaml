execution:
  action_type: open_resource
  inject_mode: null
  content: '定位：在上线前装一道冷酷的自动安检门


    触发场景：当你一个人维护几十上百条数据或代码文件，生怕手滑改错一个逗号或拼错 ID 导致线上白屏时。


    核心机制：

    1. 用原生脚本（如 Node .mjs）写出核心不变量检查：JSON 语法、必填字段、ID 唯一性与引用完整性

    2. 在 GitHub Actions 配置 push 触发工作流，校验不通过直接阻断部署

    3. 每次线上踩过一个新坑，就往校验脚本里补一条对应的防复发规则


    交付物：一套本地与云端双运行的校验脚本 + GitHub Actions 流水线文件

    推荐装配：Node.js 原生脚本 + GitHub Actions CI/CD

    误用警告：不要一开始就搭复杂的端到端测试集群，先守住“数据不坏、页面不挂”的 80/20 底线。'
