  inject_mode: append
  content: 检查 {{column_structure_and_samples}}，为 {{downstream_purpose}} 制定清洗规则。逐项写明缺失值、重复记录、日期与单位的处理，区分可自动修复和需要人工确认的情况。用小表展示输入、期望输出和校验信号。
  variables:
  - column_structure_and_samples
  - downstream_purpose
  workflow: null
