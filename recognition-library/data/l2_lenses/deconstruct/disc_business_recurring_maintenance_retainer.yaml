execution:
  action_type: show_checklist
  inject_mode: null
  content: '## 持续托管包月方案清单

    - 明确托管范围：每月固定巡检项（接口/平台规则/关键流程）

    - 明确不含项：新功能开发、大改版、第三方付费成本

    - 响应时效：工作日 N 小时内响应，紧急 P1 X 小时

    - 频率：每月 1 次巡检 + 优先微调配额 N 次

    - 季度：1 次升级复盘与范围重估

    - 定价：按月固定费 + 超出配额按次计费

    - 提案话术：交付复盘时以“降低风险” framing 提出，附范围表

    - 跟进：交付后 7 天内发总结 + 托管选项'
