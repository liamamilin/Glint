execution:
  action_type: open_resource
  inject_mode: null
  content: '定位：把神仙网站的布局与留白规律，翻译成自己的 CSS。


    步骤：

    1. 截取参考网站的 2–3 个关键区块，要求 AI 剥离具体业务内容，只提炼「栅格比例、留白节奏、边框与阴影克制度」。

    2. 将其抽象为 5 条可迁移的布局原则（而非照抄像素）。

    3. 直接生成基于该原则的极简 HTML/CSS 骨架 Demo 供自己二次改造。


    交付物：《参考界面设计语言拆解单》+ 可运行的极简布局 Demo。


    推荐装配：多模态模型 + 浏览器 DevTools。


    误用警告：拆解的是「骨架规律与克制感」，绝不是直接扒别人的品牌色和文案做山寨克隆。'
