execution:
  action_type: show_checklist
  inject_mode: null
  content: '## 健康习惯「忙时保底 + 闲时正常」设计清单


    ### 1. 明确目标习惯

    - [ ] 选择要养成的习惯：{{habit}}（如活动肩颈/快走/规律作息）

    - [ ] 记录当前最容易中断的时段：{{lazy_period}}


    ### 2. 设计双版本

    - [ ] 忙时 5 分钟保底版：只做最小动作，不换衣服、不额外准备

    - [ ] 闲时正常版：完整执行，作为加分而非必须


    ### 3. 为中断时段设计 2 个微动作

    - [ ] 微动作 1：几乎零准备、可在原地完成

    - [ ] 微动作 2：利用现有环境/道具，不增加摩擦


    ### 4. 降低摩擦

    - [ ] 把保底动作固定到现有routine（如刷牙后、开会前）

    - [ ] 移除触发放弃的高门槛步骤


    ### 5. 兜底规则

    - [ ] 今天没完成正常版，保底版也算“没断”

    - [ ] 连续 3 天只做保底，重新评估门槛'
  variables:
  - habit
  - lazy_period
  workflow: null
