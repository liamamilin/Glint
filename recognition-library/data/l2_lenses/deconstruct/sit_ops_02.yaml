  - 需要全文翻译一篇论文
execution:
  action_type: workflow_entry
  inject_mode: null
  content: '私有知识库自动归档流：

    1. 设立唯一碎片收集入口（本地 Inbox 文件 / 快捷指令 / 私有仓库 Issue）

    2. 定期触发脚本调用模型，自动提取标题、3 个受控标签与 1 句话核心价值

    3. 按统一命名规范归档为纯文本 Markdown

    交付物：结构统一、可全文秒搜的本地 Markdown 知识库

    误用警告：不收藏“以后可能会看”的万字长文原文；只归档经过大脑筛选的核心片段或自己的评注。'
  variables: []
  workflow: null
