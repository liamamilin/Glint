  pain_point: 每天随手收藏网页、金句和灵感，过一周就完全找不到它们在哪，收藏夹变成信息垃圾堆
  trigger_utterances:
  - 我收藏了一堆网页现在找不到了
  - 灵感随手记了但从来不整理
  - 笔记软件里全是垃圾收藏
  - 想建个本地知识库自动归档
  - 收藏夹爆炸了怎么办
  anti_triggers:
