execution:
  action_type: show_checklist
  inject_mode: null
  content: '冷启动起步套件设计清单


    1. 选定你熟悉的领域（技术/设计/运营/写作），列出新手在某类项目起步时最容易卡住的「空白页/配置环节」。

    2. 为该卡点设计一款 30 分钟能跑通第一版的起步套件骨架（含可运行的最小工程/模板）。

    3. 为套件附带「10 分钟上手路径」：步骤编号 + 每步预期结果 + 失败时的快速定位。

    4. 整理「常见坑提示」：环境版本、依赖、权限、网络等高频踩坑与解法。

    5. 提供一个可验证的 demo/截图，证明「30 分钟跑通第一版」。

    6. 定价与交付：明确包含内容、不包含内容、升级路径。

    7. 用真实新手走一遍流程，记录卡点并迭代。

    8. 发布渠道与反馈收集（社区/商店/邮件列表）。'
