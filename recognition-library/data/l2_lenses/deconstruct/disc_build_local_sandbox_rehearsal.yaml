id: disc_build_local_sandbox_rehearsal
title: 危险操作沙盒预演
tagline: 批量改文件或跑脚本前先 dry-run 预演与回滚，降低误操作风险。
routing:
  primitive: deconstruct
  goals:
  - optimize
  - create
  clarity_fit:
  - concrete
  domains:
  - build
  - automation
  - testing
  - risk_management
  app_affinity:
