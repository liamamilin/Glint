execution:
  action_type: show_checklist
  inject_mode: null
  content: '常青速查手册构建清单：

    1. 列出 [你的专业/兴趣领域] 中新手或从业者最容易反复查错、踩坑的 10 个概念或决策点，搭出“常青速查手册”目录大纲。

    2. 选一篇以前写过但很快沉底的观点文章，提炼其核心观点。

    3. 将该观点文改写为“结构化决策矩阵 / 避坑对照表 / 术语词典”。

    4. 为每条加清晰边界、适用条件与反例，确保可被搜索、收藏、引用。

    5. 删除时效性强的热点表述，保留长期稳定的事实与判断。

    6. 发布并持续迭代，把新增踩坑点追加到手册。'
