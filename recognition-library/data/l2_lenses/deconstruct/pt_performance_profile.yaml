  - Terminal
  pain_point: 接口或链路偏慢但不知瓶颈在哪，盲目改代码可能白忙，需要先量化基线并定位耗时部分。
  trigger_utterances:
  - 接口响应太慢帮我设计一次性能排查
  - 这个慢查询先量化瓶颈再决定改哪里
  - profiling 怎么做实验表和复测
  - 链路偏慢先测基线定位耗时部分
  - 性能问题先别改代码帮我排个查方案
  anti_triggers:
