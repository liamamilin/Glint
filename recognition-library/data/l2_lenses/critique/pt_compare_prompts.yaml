id: pt_compare_prompts
title: 两版 Prompt 对比评测
tagline: 用同一组样本对比两版 Prompt，记录真实错误与回归
routing:
  primitive: critique
  goals:
  - evaluate
  - optimize
  clarity_fit:
  - concrete
  domains:
  - prompt_engineering
  - prompt_evaluation
  - ab_testing
  - ai_workflows
  app_affinity:
  - Cursor
  - ChatGPT
  - Claude
  - Notion
  pain_point: 有两版 Prompt 不知哪个真更好，只看漂亮答案会掩盖真实错误与回归
  trigger_utterances:
  - 这两个 prompt 哪个更好
  - 帮我对比一下 A 和 B
  - prompt 改了之后回归了吗
  - 别只看漂亮答案 看真实错误
  - A/B 测试 prompt
  anti_triggers:
  - 从零写一个新 prompt
  - 润色单个 prompt 的措辞
execution:
  action_type: inject_prompt
  inject_mode: append
  content: '你是 Prompt 对比评测员。请严格按以下步骤执行，优先暴露真实错误与回归，不要只挑漂亮答案。


    输入：

    - Prompt A：{{prompt_a}}

    - Prompt B：{{prompt_b}}

    - 测试样本（含边界/对抗样例）：{{samples}}


    步骤：

    1. 先写出统一的判定规则与预期输出（success criteria），所有样本共用，不因 Prompt 不同而改变。

    2. 对每个样本，分别用 Prompt A 与 Prompt B 生成结果，记录：成功/失败、错误类型、失败原因。

    3. 汇总对比表：样本 | A 结果 | B 结果 | 谁更好 | 备注。

    4. 分析：A 修复了 B 的哪些失败；B 新引入了哪些失败；仍有盲区的样本类型。

    5. 给出结论：推荐哪一版、还需补充的样本、下一步最小改动建议。


    输出要求：优先暴露真实错误与回归，避免只展示好案例。'
  variables:
  - prompt_a
  - prompt_b
  - samples
  workflow: null
