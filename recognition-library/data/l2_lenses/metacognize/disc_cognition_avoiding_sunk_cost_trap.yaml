execution:
  action_type: show_checklist
  inject_mode: null
  content: '## 沉没成本抽离清单


    ### Step 1：确认沉没事实（不可逆）

    - 已花费的时间/金钱/精力：______

    - 这部分是否能回收：否（已沉没）


    ### Step 2：只看未来

    - 若今天才刚知道这件事，我是否愿意从头选它？（是/否）

    - 继续推进还需投入：时间 ____ / 金钱 ____ / 机会成本 ____

    - 预期未来收益（可量化）：______

    - 调整/停手的未来收益/止损：______


    ### Step 3：对照现实信号

    - 当前“不对劲”的具体证据：______

    - 是否存在可验证的改善路径：______


    ### Step 4：决策拍板

    - [ ] 继续推进（理由：______）

    - [ ] 调整方向（新方向：______）

    - [ ] 停手止损（止损边界：______）


    ### 犀利追问（嵌入日常）

    1. 如果把已投入清零，这个选择还有吸引力吗？

    2. 我是在为未来下注，还是在为过去买单？

    3. 一年后回看，我希望自己当时做了什么决定？'
