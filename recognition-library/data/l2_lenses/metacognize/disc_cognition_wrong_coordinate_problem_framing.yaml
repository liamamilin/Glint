  pain_point: 明明很努力却进展有限，误以为是方法不够细或执行不到位，其实是问题本身被定义在错误的坐标系里
  trigger_utterances:
  - 这个项目推不动是不是我方法还不够细
  - 明明很努力却没进展是不是执行不到位
  - 指标很好但结果不对劲
  - stuck on this for weeks need reframe
  anti_triggers:
  - 需要把现有流程拆成执行步骤
  - 想对单一方案做红队找漏洞
execution:
  action_type: show_checklist
  inject_mode: null
  content: '换坐标系检查清单：

    1. 我最近在 [某个目标/项目/难题] 上花了不少力气但进展有限：[简述现状]。

    2. 请跳出当前解法，提出 2 个完全不同的「问题坐标系」来重新定义这件事。

    3. 检查我目前用来衡量 [某件事进展] 的指标：[填当前指标]，它有没有可能把人引向错误方向？

    4. 建议一个更贴近本质的替代视角。

    5. 对比「加倍努力」与「换坐标系」哪个更可能破局，拍板下一步。'
