id: atlas_obra_superpowers_skills_brainstorming_skill_md
title: 构建前澄清与设计批准门禁
tagline: 在动手前把模糊需求收敛成已批准的设计，避免返工
routing:
  primitive: metacognize
  goals:
  - create
  - optimize
  clarity_fit:
  - vague
  - concrete
  domains:
  - requirements
  - design
  - software_engineering
  - product
  app_affinity:
  - Cursor
  - VS Code
  - Notion
  - Claude
  pain_point: 想开始做东西但需求还模糊，怕做错返工；不知道该先问什么、怎么把模糊想法收敛成可执行设计并拿到批准。
  trigger_utterances:
  - 帮我开始做这个功能但需求还不清
  - 我想先理清需求再动手
  - 这个需求太模糊了先帮我澄清
  - 开始构建前帮我过一遍设计
  - 先别写代码，帮我把想法收敛成方案
  anti_triggers:
  - 只是把图标颜色改一下这种明确小任务
  - 纯代码调试或修 bug，不需要设计门禁
execution:
  action_type: inject_prompt
  inject_mode: append
  content: 在开始任何创造性构建前，先把模糊请求收敛为已批准的设计。流程：1) 先读项目与用户提供的上下文（spec、计划、文件、早前对话），不重问已答问题、不重开已决定的事。2) 判断信息是否完整：完整则直接执行并说明；缺失非平凡信息则开启澄清对话。3)
    首条消息：已说清想要什么则约200词复述请求形状（想要什么/给谁/为什么）+现状与影响+约束/冲突/更便宜路径，结尾一行邀请纠正；未说why则问一个开放式问题不给选项；why已明但有未决事项则问影响最大的一个，可命名选择时具体描绘选项、权衡与你的选择；无未决事项且只有一条合理路径则在消息末尾给短设计并请批准。根据对方是否要求头脑风暴决定结尾（已要求则在问题处结束；未要求加轻量提议）。4)
    澄清对话：一次只问一个影响构建的未决问题；know why前开放式不附示例；know why后对可命名选择具体描绘；用户说just guess/what do you think时提出具体方案；过程性步骤由你决定并说明。Ground to
    cover仅作领域清单，不逐条读成问题。5) 分段复述：某部分理解到足以描述时用200-300词复述该部分，再回到下一部分问题；复述与提问交替；只有他们说的内容算他们的，你补充的内容作为提议附理由；每块结尾问有什么错或缺失。6) 方案选择：写文档前单独一条消息列出真实备选（去掉弱的），描绘2-3个可想象的方案，基于项目实际与权衡，推荐一个并说明为什么，然后问走哪条；若how交给你则说明按自己选择走；若只有一条合理路径则说明并解释其他为何不合适，设计放下一消息。7)
    硬门禁：①单独消息列出方案并由伙伴选择；②写设计文档；③取得伙伴对文档批准；④调用writing-plans。设计文档获批准前什么都不构建（阅读探索可以）。例外：伙伴选择跳过提问时方法结束、门禁结束；伙伴同意的一次性spike可构建但须throwaway标记。
  variables: []
  workflow: null
