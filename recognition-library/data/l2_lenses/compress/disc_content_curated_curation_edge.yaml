  - 需要 SEO 批量生成文章
execution:
  action_type: show_checklist
  inject_mode: null
  content: '反过载策展专栏 checklist：

    1. 锁定垂直领域，列出读者每天被轰炸的低质重复信息类型（至少 5 类）。

    2. 定义专栏节奏：每月 1 期，每期 3~5 条，每条附实测验证证据（截图/数据/对比）。

    3. 制定透明入选红线：来源可信度、可复现性、独特性、实用性四维度打分，低于阈值直接淘汰。

    4. 设计淘汰标准：过时、不可复现、同质化、营销软文一律剔除，并公开落选理由。

    5. 为每条精选写“为什么值得你花 3 分钟”一句话，拒绝空泛推荐。

    6. 建立读者反馈回路：每期末收集“哪条最值/哪条踩雷”，迭代下期选题。

    7. 用固定模板呈现：问题→证据→适用场景→局限，保持可扫读。

    8. 定期复盘：季度回顾入选率与读者留存，调整红线松紧度。'
