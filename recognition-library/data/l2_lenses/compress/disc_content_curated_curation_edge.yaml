  pain_point: 做内容总被日更追热点绑架，却没人替读者狠删 99% 噪音，只留实测过的 1% 精选
  trigger_utterances:
  - 日更太累了有别的内容打法吗
  - 想做个策展号但不知道怎么结构化
  - 读者信息过载怎么做出差异化
  - 每月发一次能做号吗
  - 怎么定入选和淘汰标准
  anti_triggers:
