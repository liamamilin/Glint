execution:
  action_type: open_resource
  inject_mode: null
  content: 认知降噪复位器：1) 列出此刻物理层面的3个基本事实（安全、温饱、当下无致命威胁）；2) 把担忧分为“此刻能动”与“此刻不可控”；3) 对不可控项挂起封存，从可控项中选1件15分钟内可完成的小动作立刻执行。交付物：一张极简《当下锚定单》（3个物理事实
    + 1个15分钟微动作）。
