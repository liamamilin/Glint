  pain_point: 用户被无休止的过度思考和对遥远不确定性的焦虑困住，休息时也无法真正放松，需要把注意力拉回当下。
  trigger_utterances:
  - 我脑子停不下来一直在想各种可能
  - 休息时也焦虑得没法真正放松
