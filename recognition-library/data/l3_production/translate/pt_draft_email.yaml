id: pt_draft_email
title: 起草一封邮件
tagline: 把背景事实转成可发送的邮件正文
routing:
  primitive: translate
  goals:
  - create
  clarity_fit:
  - vague
  - concrete
  domains:
  - writing
  - email
  - communication
  app_affinity:
  - Mail
  - Chrome
  - Slack
  - Feishu
  pain_point: 需要发一封邮件但不知道怎么组织语言，让对方一眼看懂背景、要做什么以及下一步和期限
  trigger_utterances:
  - 帮我写封邮件给老板汇报进度
  - draft an email to the client asking for approval
  - 这封回信怎么写才清楚
  - 帮我把这段背景写成一封正式邮件
  - 写一封邮件让对方明天给答复
  anti_triggers:
  - 帮我写一篇博客文章
  - 把这段中文翻译成英文
execution:
  action_type: inject_prompt
  inject_mode: append
  content: 根据 {{background}} 写一封给 {{recipient}} 的邮件，目的是 {{purpose}}。要求：给出邮件主题和一封可直接发送的正文；首段直接提出请求；结尾写清下一步动作和期限。未提供的日期或承诺用占位符表示，整体语气采用
    {{tone}}。
  variables:
  - background
  - recipient
  - purpose
  - tone
  workflow: null
