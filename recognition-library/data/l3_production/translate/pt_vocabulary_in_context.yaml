execution:
  action_type: inject_prompt
  inject_mode: append
  content: 从【材料或主题】为【水平】挑十个可马上使用的词组。每个给语义、自然搭配、真实场景、混淆项和一句填空。把答案集中在结尾，并指出哪些表达偏口语或正式。
  variables:
  - '{''name'': ''材料或主题'', ''description'': ''学习材料或主题''}'
