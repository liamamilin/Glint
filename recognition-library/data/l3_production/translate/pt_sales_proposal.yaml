id: pt_sales_proposal
title: 整理客户方案草稿
tagline: 把客户需求与已确认条件编成可审阅的方案草稿，范围交付时间验收与待确认项齐全。
routing:
  primitive: translate
  goals:
  - create
  clarity_fit:
  - vague
  - concrete
  domains:
  - marketing
  - sales_proposal
  - b2b_sales
  - proposal_writing
  - client_communication
  app_affinity:
  - Notion
  - Mail
  - Feishu
  - Slack
  pain_point: 手头有客户需求和已确认条件，但不知道如何整理成一份可审阅的客户方案，范围、交付、时间、验收、边界和待确认项散落各处，容易漏项或过度承诺。
  trigger_utterances:
  - 帮我把客户需求整理成一份方案给客户看
  - 这个销售提案要包含范围和交付时间
  - 客户要方案草稿，我得把已确认条件写进去
  - 帮我起草一份可审阅的商务方案
  - 把需求转成 proposal 发给客户
  anti_triggers:
  - 不适用于纯内部技术方案或不涉及客户交付的文档
  - 不适用于已定稿只需润色或翻译的场景
execution:
  action_type: inject_prompt
  inject_mode: append
  content: 将 {{client_requirements}} 写成给 {{client_role}} 的方案草稿。包含：1) 目标与背景；2) 交付范围（每项能力回指实际证据）；3) 时间计划；4) 验证/验收方式；5) 计划外事项（Out
    of scope）；6) 待确认条款（价格、日期等缺失时明确标注待确认）。语气专业、可审阅，避免过度承诺。
  variables:
  - client_requirements
  - client_role
  workflow: null
