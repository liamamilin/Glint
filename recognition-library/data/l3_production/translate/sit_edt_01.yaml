id: sit_edt_01
title: 个人语调校准器
tagline: 洗掉 AI 味，生成个人写作风格宪法
routing:
  primitive: translate
  goals:
  - optimize
  clarity_fit:
  - concrete
  domains:
  - content_writing
  - copywriting
  - editorial
  app_affinity:
  - ChatGPT
  - Claude
  - Notion
