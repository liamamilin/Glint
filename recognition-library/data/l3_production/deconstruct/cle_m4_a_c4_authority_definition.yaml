id: cle_m4_a_c4_authority_definition
title: 决策权限结构 (A-C4)
tagline: 权限结构不清 → 明确每类关键决定的拍板人、覆盖/撤销与升级规则
routing:
  primitive: deconstruct
  goals:
  - optimize
  - create
  clarity_fit:
  - conflicted
  - concrete
  domains:
  - action
  - coordination
  - general
  app_affinity:
  - Feishu
  - Slack
  - Cursor
  pain_point: 项目推进中一到关键节点就不知道谁能拍板、谁能一票否决、出事谁有权回滚，导致反复内耗
  trigger_utterances:
  - 帮我梳理这个项目的关键决策权限结构：谁能拍板、谁能撤销、冲突找谁升级
  - 整理一份清晰的权限矩阵，写明每类决定的有权角色、依据来源和边界
  - 避免遇事互相推诿或越权，帮我定义好批准、覆盖、回滚和升级权限
  - 检查一下这份分工里有没有把“职位/负责”错当成了“有决策权
  anti_triggers: []
execution:
  action_type: inject_prompt
  inject_mode: append
  content: '请帮我围绕以上场景的关键决策节点，梳理一份清晰的“权限结构定义”：

    1. **列出关键决定清单**：识别执行过程中所有需要批准、发布、变更或回滚的关键决定。

    2. **逐项绑定权限要素**：为每类决定写明——① 谁有权决定；② 授权依据来源；③ 适用范围与期限；④ 所需技术访问条件。

    3. **写明异常权责**：明确谁有权覆盖/撤销原决定、例外情况如何处理以及发生权限冲突时向谁升级，提交适用方确认。


    **检查与边界**：职位头衔、承担责任与拥有技术凭证是三件不同的事，不能自动互相推出决策权。'
  variables: []
  workflow: null
