execution:
  action_type: show_checklist
  inject_mode: null
  content: '## 14天微型实验设计清单


    ### 1. 明确纠结点

    - [ ] 用一句话写出你的纠结：[描述你的纠结，如移居/自由职业/新方向]

    - [ ] 写出你理想中的新生活方式：[描述理想状态]


    ### 2. 拆解幻想与麻烦

    - [ ] 列出你最可能高估的 3 个幻想

    - [ ] 列出你最可能低估的 3 个日常麻烦


    ### 3. 设计 14 天微型实验

    - [ ] 定义一个成本极低、完全可回滚的实验动作

    - [ ] 明确实验起止日期（14 天内）

    - [ ] 列出 3 个可量化评估指标（体感/时间/成本/情绪）


    ### 4. 周末最小现实模拟

    - [ ] 设计一次周末就能跑通的最小模拟

    - [ ] 记录模拟中的真实摩擦与惊喜


    ### 5. 回滚与决策

    - [ ] 预设回滚条件（什么信号出现就放弃）

    - [ ] 实验结束后对照 3 个指标做拍板'
