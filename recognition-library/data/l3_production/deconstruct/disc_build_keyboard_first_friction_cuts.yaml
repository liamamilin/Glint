  content: '1. 盘点每天最常重复打开或切换的 5 个窗口/工具/动作：[填入你的高频操作]。

    2. 从中挑出最值得优先设快捷键的 3 个，并给出无冲突的按键组合建议。

    3. 在常用编辑器/终端/浏览器/启动器中，找出能把多步操作压成一键触发的实用小配置。

    4. 应用配置并试用一周，记录使用频率变化。'
