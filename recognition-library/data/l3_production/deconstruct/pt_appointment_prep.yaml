  - 与医疗或咨询无关的差旅打包清单
execution:
  action_type: inject_prompt
  inject_mode: append
  content: 我准备去【预约类型和地点】，目前有【相关记录和问题】。帮我整理一页可带去的材料清单、按时间排列的客观记录，以及必须当面问的三个问题。分清已经准备、待确认与当天携带的项目。
  variables:
  - 预约类型和地点
  - 相关记录和问题
  workflow: null
