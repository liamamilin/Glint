id: cle_m1_r_p7_expansion
title: 标签展开溯源 (R-P7)
tagline: 压缩表征 → 拆解回具体情境、属性与待查项（防编造）
routing:
  primitive: deconstruct
  goals:
  - digest
  - evaluate
  clarity_fit:
  - vague
  - concrete
  domains:
  - representation
  - general
  app_affinity: []
  pain_point: 面对一个高度压缩的标签或大词（如“项目失败”“架构腐化”“沟通不畅”），需要展开回具体情境与可检查方面，同时防止把脑补的细节当成已有事实
  trigger_utterances:
  - 这个说法太抽象压缩了，帮我展开看看具体对应哪些情况
  - 我说“项目失败”太笼统了，拆开看看材料支持到哪里、缺什么
  - 把这个标签展开成具体属性和待查项，别把猜测当事实
  - 这句总结背后具体发生了什么，帮我区分已有记录和待查问题
  - 这个是什么情况
  - 展开讲讲这个是什么
  anti_triggers: []
execution:
  action_type: inject_prompt
  inject_mode: append
  content: '请帮我把以上高度压缩的说法或标签展开回具体情境与可核查的维度：

    1. **回到材料与情境**：先列出已有材料中关于这个说法具体记录了哪些事件、状态或条件（没有来源材料时不要伪装还原细节）。

    2. **按用途列出待展开维度**：围绕当前用途，列出还需要追问的具体状态、条件或关系方面。

    3. **三栏严格分离**：清晰分开呈现——① **原材料直接支持的内容**；② **基于材料的候选解释**；③ **新想到的待查项及获取渠道**。


    **完成检查与边界**：展开不是无损解压；新生成的候选细节绝不能补写成已发生的事实，也不能声称自动恢复了压缩时丢失的信息。

    *(向内自问备用句：“我说这个词时，具体想到什么，哪些还只是待查项？”)*'
  variables: []
  workflow: null
