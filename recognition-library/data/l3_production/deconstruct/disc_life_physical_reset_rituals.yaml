execution:
  action_type: show_checklist
  inject_mode: null
  content: '身体状态切换微重启清单


    白天版（5-10 分钟）：

    - [ ] 站起来离开屏幕，快走 2-3 分钟或爬一层楼梯

    - [ ] 到窗边晒光/看远物 1-2 分钟，让呼吸慢下来

    - [ ] 做 30-60 秒拉伸：颈肩、胸椎、髋屈肌

    - [ ] 用冷水洗脸或洗手 20-30 秒，再喝一口水

    - [ ] 回到任务前只选一个最小下一步，避免重新陷入全盘思考


    睡前版（5-10 分钟）：

    - [ ] 关闭强光屏幕，调暗环境光

    - [ ] 做 2-3 分钟轻柔拉伸或慢走，不追求出汗

    - [ ] 4-6 次深呼吸，把注意力放在呼气延长上

    - [ ] 用温水/冷水轻敷面部或洗手，降低身体紧绷

    - [ ] 写下未完成事项和明天第一件事，停止脑内循环


    状态切换仪式：

    - [ ] 选择一个固定触发动作（如合上电脑、起身泡茶、出门散步）

    - [ ] 用同一套简短动作标记“工作结束/休息开始”

    - [ ] 休息时不做工作相关思考，必要时只记录灵感不展开

    - [ ] 回到工作前重新定义一个明确的最小任务'
