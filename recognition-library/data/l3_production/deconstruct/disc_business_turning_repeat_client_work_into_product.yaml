execution:
  action_type: show_checklist
  inject_mode: null
  content: '## 把重复定制抽成标准产品


    - [ ] 盘点过去 3-5 次同类交付，记录每次的目标、输入、步骤、输出和耗时

    - [ ] 标出每次都会重复出现的 70% 骨架：调研、方案结构、交付清单、验收标准、跟进节奏

    - [ ] 单独列出 30% 可定制项：客户行业、数据源、品牌语气、特殊约束、额外模块

    - [ ] 为标准部分编写固定 SOP：负责人、输入要求、执行步骤、输出格式、检查点

    - [ ] 制作可复用资产：提案模板、报价表、 kickoff 问卷、交付清单、验收表

    - [ ] 定义固定周期与边界：开始条件、里程碑、交付日期、修改次数、超范围处理

    - [ ] 设计分层报价：标准包、定制增强包、长期维护包

    - [ ] 用下一次真实客户试跑标准流程，记录偏差和额外沟通成本

    - [ ] 根据试跑结果更新模板与 SOP，移除仍需人工判断的模糊步骤

    - [ ] 建立产品目录与版本号，避免每次重新发明流程'
