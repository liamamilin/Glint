execution:
  action_type: show_checklist
  inject_mode: null
  content: '## 局部合理却全局僵局排查清单


    ### 1. 梳理流转管道

    - [ ] 列出 [工作流/工具链/协作机制] 的全部环节与规则

    - [ ] 标注每个环节的输入、输出、等待条件

    - [ ] 识别所有缓冲、审批、特判、重试、回滚节点


    ### 2. 识别死锁节点

    - [ ] 哪个节点需要上游产物才能动，但上游又依赖它？

    - [ ] 哪里存在“先审批再执行，执行结果再审批”的循环？

    - [ ] 哪里有“ everyone can veto, no one can decide” 的否决权堆叠？

    - [ ] 哪里缓冲叠加导致延迟累积超过 SLA？

    - [ ] 哪里特判过多导致路径分支爆炸、没人敢动？


    ### 3. 全局流转验证

    - [ ] 画出端到端最小流转路径（happy path）

    - [ ] 标注每步等待时间与失败回退代价

    - [ ] 检查是否存在“局部最优但全局阻塞”的规则

    - [ ] 试跑一次完整流转，记录卡点与 workaround


    ### 4. 修复建议

    - [ ] 能合并的审批合并，能前置的校验前置

    - [ ] 为死锁节点设超时与自动升级

    - [ ] 明确单一决策 owner，消除否决权堆叠

    - [ ] 删除“单独合理但全局无用”的特判'
