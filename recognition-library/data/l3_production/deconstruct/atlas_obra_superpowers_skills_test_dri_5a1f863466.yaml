title: TDD 红绿重构循环
tagline: 先写失败测试再写最小实现，避免虚假信心与过度设计
routing:
  primitive: deconstruct
  goals:
  - create
  - debug
  clarity_fit:
  - vague
  - concrete
  domains:
  - engineering
  - testing
  - tdd
  - quality_assurance
  app_affinity:
  - Cursor
  - VS Code
  - Terminal
  pain_point: 先写生产代码后补测试，测试永远绿灯发现不了回归，重构和改行为时心里没底
  trigger_utterances:
  - 帮我用 TDD 实现这个功能
  - 先写失败测试再写实现
  - 这个 bug 要不要先写个失败测试
  - 重构前先把测试加上
  - 别让我先写实现再补测试
