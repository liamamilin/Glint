execution:
  action_type: show_checklist
  inject_mode: null
  content: '睡前 30 分钟关机缓冲清单（25 分钟内完成）


    T-30min 降噪收尾

    - [ ] 关闭工作/消息通知，手机切勿扰或放到别处

    - [ ] 停止刷短视频/刺激内容，切换到低光、低音量环境


    T-20min 脑内清空（Brain Dump）

    - [ ] 今天没做完但明天必须做的 1-2 件事是什么？

    - [ ] 有什么悬而未决的杂事需要先记下来？

    - [ ] 明天第一件要做的事是什么？写成一句话


    T-10min 放松降速

    - [ ] 5 分钟轻度拉伸/深呼吸/热水洗漱

    - [ ] 5 分钟低刺激阅读或白噪音，不看屏幕


    入睡

    - [ ] 灯光调暗，上床只做睡觉的事'
