execution:
  action_type: show_checklist
  inject_mode: null
  content: '## Agent-Native 基础设施设计清单


    ### 第一部分：识别人类中心摩擦点

    列出 5 个目前完全为人类设计的互联网基础设施（如邮箱、日历、支付、客服），对每个分析：

    - 原产品的最大摩擦点（当使用者变成 AI Agent 时）

    - 对应的极简 API 替代品该如何设计（无 GUI、结构化输入输出、幂等、可审计）


    ### 第二部分：最小 MVP 3 核心接口

    在你的技术栈/熟悉领域中，为自主运行的 AI Agent 提供安全沙盒和权限审计层，最小独立开发者 MVP 只做哪 3 个核心接口？

    - 接口 1：身份与权限声明（Agent 身份注册、scope 授权、token 颁发）

    - 接口 2：沙盒执行与资源隔离（受限环境运行、资源配额、网络白名单）

    - 接口 3：审计与回滚（操作日志、权限变更记录、一键撤销）


    ### 验收标准

    - 每个接口有明确的 request/response schema

    - 无任何人类 GUI 依赖，纯 API 驱动

    - 权限最小化，默认拒绝'
