execution:
  action_type: show_checklist
  inject_mode: null
  content: "把私有工作流转化为公开内容资产 · 执行清单\n\n1. 锁定重复动作\n   - 写下你每周/每月反复做的一件事（排查、选型、踩坑、分类）\n   - 确认它有明确输入与输出，能被他人复用\n\n2. 结构化沉淀\n\
    \   - 把过程拆成步骤/分支/判断条件，形成 MECE 清单\n   - 提炼其中的 Prompt、模板、分类库、工具链接\n\n3. 设计传播切入点（选 3 个）\n   - 反常识：指出行业旧共识的盲区\n   - 可复用：提供可直接复制的模板/清单\n\
    \   - 可验证：给出最小可运行示例或 Before/After\n\n4. 选载体并发布\n   - 静态卡片库 / 极简可搜索网页 / GitHub 仓库 / Notion 公开页\n   - 加入搜索、标签、更新日期，便于长期\
    \ SEO\n\n5. 持续迭代\n   - 每次新踩坑追加条目，保持资产活性\n   - 在社交平台只发“资产链接 + 一句话场景”，不重复写长文"
