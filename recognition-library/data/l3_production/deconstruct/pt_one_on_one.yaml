  content: 为与【对象和关系】的一对一准备【时长】议程。根据【最近进展和待讨论问题】，排出对方可能关心的事项、一个开放问题、要请求的帮助和最后确认的动作。
  variables:
  - 对象和关系
  - 时长
  - 最近进展和待讨论问题
