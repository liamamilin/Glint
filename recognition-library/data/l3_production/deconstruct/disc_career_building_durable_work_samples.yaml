  content: '## 20 分钟项目结项复盘清单

    - [ ] 一句话背景：目标、角色、时间、范围

    - [ ] 卡点：最难的 1-3 个问题与约束

    - [ ] 做法与取舍：做了什么、放弃了什么、为什么

    - [ ] 结果与证据：指标、交付物、反馈

    - [ ] 反思：下次重复 / 避免 / 自动化什么

    - [ ] 脱敏：删除客户与内部数据，保留方法与判断

    - [ ] 归档：命名、标签、链接到简历或作品集


