execution:
  action_type: show_checklist
  inject_mode: null
  content: '实验记录写作清单：

    1. 回顾最近一次真实尝试/踩坑，写下试了什么、发生了什么意外。

    2. 提取书本与教程里很少写、但实战中经常遇到的真实细节（失败截图、数据、转折点）。

    3. 去掉空洞鸡汤与高大上框架，只保留诚实、克制、有细节的叙述。

    4. 按“旧共识 → 新现实 → 破冰追问”的结构组织，突出稀缺感。

    5. 自检：是否包含至少一处亲手试错的证据与一次意外转折。


    破冰追问模板：

    - 我最近做了一次真实尝试或踩坑：[简述你试了什么、发生了什么意外]。帮我把它整理成一篇诚实、克制、有细节的“实验记录”，去掉空洞鸡汤。

    - 在 [你的领域] 里，有哪些“书本和教程里很少写、但实战中经常遇到”的真实细节，适合写成短小精悍的实战笔记？'
