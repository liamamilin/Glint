id: disc_content_clear_takeaway_and_next_step
title: 结尾给5分钟小动作
tagline: 把空泛升华换成读者5分钟能试的小动作
routing:
  primitive: deconstruct
  goals:
  - create
  - optimize
  clarity_fit:
  - vague
  - concrete
  domains:
  - content
  - writing
  - copywriting
  - content_strategy
  app_affinity:
  - Notion
  - Obsidian
  - Chrome
