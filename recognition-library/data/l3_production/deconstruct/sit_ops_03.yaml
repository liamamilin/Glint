execution:
  action_type: open_resource
  inject_mode: null
  content: '《API 预算硬限清单》+ 自动化存活拨测告警流


    1. 在所有大模型 API 后台强制设死「硬性月度消费上限（Hard Limit）」与 50%/80% 告警线。

    2. 在自动化脚本里写入最大重试次数（Max Retries）与单次 Token 熔断阈值。

    3. 配置免费定时拨测（Uptime Check），静态站或关键接口返回非 200 状态时立即发通知。


    推荐装配：API 平台预算硬限 + GitHub Actions 拨测 / 免费 Uptime 监控。


    误用警告：不要只在代码里写软限制而不开平台级硬限；代码本身可能出 Bug，平台账单锁才是最后底线。'
