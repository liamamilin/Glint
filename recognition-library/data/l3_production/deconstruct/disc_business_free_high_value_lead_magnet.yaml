  pain_point: 做获客或建专业影响力，只会硬广或写长篇PDF资料包，参与感低、转发差，无法让用户快速感知价值
  trigger_utterances:
  - 获客只会发PDF白皮书没人下载
  - 想做一个互动计算器做引流
  - 客户算不清自己能省多少钱
  - 设计一个诊断小工具提升转化
  - lead magnet 除了 PDF 还能做什么
