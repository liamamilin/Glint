execution:
  action_type: show_checklist
  inject_mode: null
  content: '## 互动引流小工具设计清单


    ### 1. 找到“算不清的账”

    - [ ] 列出目标客户最关心但算不清的一笔账/风险（如：能省多少钱、还差哪一步、存在什么隐患）

    - [ ] 确认该问题可以在1分钟内得出结果


    ### 2. 设计极简输入（≤3数字 / ≤4题）

    - [ ] 选出3个关键输入参数（如：团队人数、月成本、当前转化率）

    - [ ] 或设计4道选择题，每题2-4选项

    - [ ] 避免自由文本输入，降低摩擦


    ### 3. 定义核心公式/打分逻辑

    - [ ] 写出明确的计算公式或加权打分规则

    - [ ] 给出结果分级（如：优秀/需优化/高风险）

    - [ ] 为每个分级准备1-2句解读文案


    ### 4. 结果页与转化钩子

    - [ ] 展示定制诊断结果（数字/分数/等级）

    - [ ] 提供1个明确的下一步CTA（预约/下载/联系）

    - [ ] 加入分享按钮，鼓励转发


    ### 5. 验证与迭代

    - [ ] 用真实客户试用，记录完成率与分享率

    - [ ] A/B测试不同CTA文案

    - [ ] 根据数据调整公式或题目'
