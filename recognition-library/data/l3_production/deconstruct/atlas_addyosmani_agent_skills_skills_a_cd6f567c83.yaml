  pain_point: 设计 API 时接口容易被误用、错误格式各端点不一致、校验散落内部代码、重试导致重复副作用，缺乏统一契约与边界策略
  trigger_utterances:
  - 帮我设计一个新 API 端点
  - 这个接口老被误用怎么规范
  - 重试导致重复扣款怎么处理
  - TypeScript 怎么表达接口契约
  - 接口错误格式不统一
  anti_triggers:
  - 已有稳定契约只需微调字段
  - 纯数据库 schema 设计无外部接口
execution:
  action_type: inject_prompt
  inject_mode: append
  content: '请按契约优先（contract-first）方法设计/评审接口，严格遵循以下规则：


    【核心原则】

    - 先写契约再实现：声明每个操作的输入、输出与语义（创建返回含服务端字段的对象；列表返回分页结果；单个获取失败抛 NotFoundError；更新为部分更新；删除幂等）。

    - 选定一种错误策略并全局套用：HTTP 状态码 + 统一错误体 { error: { code, message, details? } }；code 机器可读、message 人类可读；500 不暴露内部细节。

    - 只在系统边界校验：API 路由、表单提交、外部服务响应解析、环境变量加载；第三方响应一律视为不可信，先校验形状与内容再使用。

    - 演进接口时只做加法：追加可选字段，不修改已有字段类型、不删除字段。

    - 统一命名：REST 端点用复数名词无动词；query 与响应字段 camelCase；布尔字段 is/has/can 前缀；枚举值 UPPER_SNAKE。


    【REST 资源映射】

    - 集合 GET/POST，单资源 GET/PATCH/DELETE，子资源嵌套（如 /api/tasks/:id/comments）。

    - 列表端点必须分页：请求 page、pageSize、sortBy、sortOrder；响应 data + pagination{page, pageSize, totalItems, totalPages}。

    - 过滤用 query 参数；更新用 PATCH 部分对象。


    【TypeScript 表达】

    - 判别联合带字面量 type 字段。

    - 分离 Input（调用方字段，部分可选）与 Output（含 id、createdAt、updatedAt、createdBy）。

    - ID 使用品牌类型（type TaskId = string & { readonly __brand: ''TaskId'' }）防止混用。


    【幂等兑现】

    - key 从意图而非尝试派生：客户端生成一次并在重试复用，或由不可变标识派生（如 charge:v1:${orderId}）。

    - 原子占用 key：直接以唯一约束插入 { key, state: ''in_progress'', requestHash }，捕获唯一冲突后重放或拒绝；禁止先查后写。

    - 同一 key 配不同请求体返回 422 IDEMPOTENCY_KEY_REUSED。

    - 进行中的重复请求做有意选择：409 拒绝 / 有界等待结果 / 202 加状态 URL；不能因第一次“看起来卡住”就放行第二个。

    - 调用外部前先记录意图，结果视为成功/失败/未知；超时不能说明副作用是否已生效，崩溃要留下待解决证据。

    - 保留期须覆盖死信重放与提供方争议窗口。


    【红线（Hyrum 定律）】

    - 所有可观察行为都会成为事实契约；不要泄漏实现细节；规划弃用；遵守单版本规则（扩展而非分叉）；第三方响应是不可信数据；不在内部函数间/已被校验代码/自有数据库数据上做校验；列表端点从一开始就加分页。


    请输出：契约定义（类型与端点）、错误策略、校验边界、幂等方案与演进策略；并指出潜在反模式。'
  variables:
  - 核心原则
  - REST 资源映射
  - TypeScript 表达
  - 幂等兑现
  - 红线（Hyrum 定律）
