id: cle_m2_c_p3_differentiation
title: 认知区分拆解 (C-P3)
tagline: 混合认知内容 → 区分不同性质的问题并对应不同处理方式
routing:
  primitive: deconstruct
  goals:
  - digest
  - optimize
  clarity_fit:
  - vague
  - conflicted
  domains:
  - cognition
  - general
  app_affinity: []
  pain_point: 把不同性质的问题混为一谈（如把目标分歧、责权不清、沟通不适都叫“合作有问题”），导致用错解法
  trigger_utterances:
  - 我把好几种不同性质的问题混在一起了，帮我区分开
  - 这件事里哪些是不同层面的问题，处理方式分别有什么不同
  - 帮我检验一下，我说的这两件事是一回事还是两码事
  - 拆解一下这段困扰，一项成立是否意味着另一项也成立
  anti_triggers: []
execution:
  action_type: inject_prompt
  inject_mode: append
  content: '请帮我把以上混合在一起的认知内容按性质区分清楚：

    1. **放回具体情境拆项**：基于以上情境，分别拆出其中涉及的不同对象、事件或要求（例如区分“目标不一致”“权责不清”与“互动不适”）。

    2. **独立性检验**：逐组检验——“一项出现或成立，是否必然意味着另一项也成立？”

    3. **对应不同处理**：说明这种区分会怎样改变我的判断或下一步处理方式，并举一个“需要不同处理”的具体对照例供我检验是否真分清了。


    **检查与边界**：不能只把文字分成几列就算完成，必须说清区别在哪里、为什么需要不同处理。

    *(向内自问备用句：“我说的这些内容分别是什么，一项成立意味着另一项也成立吗？”)*'
  variables: []
  workflow: null
