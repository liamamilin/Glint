execution:
  action_type: open_resource
  inject_mode: null
  content: Taxonomy 分类骨架仪：先分离前台心智模型（用户怎么找）与后台正交标签（系统怎么筛）；对相邻分类强制写出裁决线（灰色内容明确归 A 不归 B）；锁定受控词表（Enum）与单条记录 Schema，先跑通 4 条样板数据再扩量。交付物：含分类边界裁决线与
    JSON Schema 的 DESIGN.md。推荐装配：多轮架构对齐对话 + JSON Schema/校验脚本。误用警告：仅 5 条零散笔记时不要过度设计三层嵌套分类，体量上来再抽象。
  variables: []
  workflow: null
