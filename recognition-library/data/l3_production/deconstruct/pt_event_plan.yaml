  pain_point: 活动策划散落在聊天和便签里，时间、人员、物资、联络没有统一表，临场容易混乱
  trigger_utterances:
  - 帮我把周六的生日派对拆成执行表
  - 婚礼流程和分工帮我理一下
  - 活动策划从时间人员物资到联络安排
  - 帮我排个活动倒排表
  - 聚会物资和分工怎么安排
  anti_triggers:
  - 纯创意头脑风暴无具体活动
