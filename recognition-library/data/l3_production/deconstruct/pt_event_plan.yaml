execution:
  action_type: inject_prompt
  inject_mode: append
  content: 策划【活动类型和目标】给【参与人数和需求】，限制是【地点、日期和资源】。交付倒排时间表、当日流程、物资与分工，以及天气或缺席的备选。标出凡需确认开放时间或预订的项目。
  variables:
  - 活动类型和目标
  - 参与人数和需求
  - 地点、日期和资源
  workflow: null
