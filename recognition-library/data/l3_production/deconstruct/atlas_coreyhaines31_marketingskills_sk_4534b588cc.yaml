title: 营销页文案情境诊断
tagline: 先诊断空白/真实声/定点，再分块起草筛行
routing:
  primitive: deconstruct
  goals:
  - create
  - optimize
  clarity_fit:
  - vague
  - concrete
  domains:
  - copywriting
  - marketing
  - content_strategy
  - landing_page
  app_affinity:
  - Notion
  - Chrome
  - Cursor
  - ChatGPT
  pain_point: 营销页文案写出来像 AI 套话、头条和 CTA 弱、不知道从哪下手或该改哪里，最终不可信不可证
  trigger_utterances:
  - 首页文案像 AI 写的帮我重写
  - 落地页 headline 太弱了
  - 这个定价页文案帮我改改
  - 产品页 copy 太套话
  - about 页文案重写一下
  anti_triggers:
