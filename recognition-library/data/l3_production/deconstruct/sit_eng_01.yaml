  content: 一套零 npm 依赖、开箱即部署的静态站基础仓库模板：原生 HTML + CSS Variables + ES Modules，数据层抽离为纯静态 JSON 通过 fetch 加载与前端过滤，直接托管至 GitHub Pages
    或 Cloudflare Pages 实现零服务器账单与秒级全球分发。推荐装配：原生 HTML/CSS/JS + GitHub Pages + GitHub Actions。误用警告：不要强行用纯静态站去扛需要复杂后端鉴权、实时多人协作或高并发写入的业务。
