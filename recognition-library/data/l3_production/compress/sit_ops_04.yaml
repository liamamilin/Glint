  pain_point: 每次用 AI 干同类活都要重新交代一遍背景、格式和避坑点，重复到想吐，时间全耗在重复劳动上
  trigger_utterances:
  - 这个需求我上周也做过，又要重新给 AI 讲一遍背景
  - 每次生成报告格式都不对，得反复强调
  - 同样的 prompt 又要敲第三遍了
  - 我是不是该把这套流程固定下来
  - 能不能做成一个可复用的 skill
  anti_triggers:
