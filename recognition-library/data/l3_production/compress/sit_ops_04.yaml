execution:
  action_type: open_resource
  inject_mode: null
  content: '资源：高频任务 Skill 封装指南（SKILL.md 规范 + 版本化托管）

    来源: https://liamamilin.github.io/SUPER-INDIVIDUAL-TOOLBOX/data/ops-automation.json#ops-04


    操作步骤：

    1. 回溯最近 3 次最满意的同类对话，提取共性输入参数、执行步骤与输出格式

    2. 把隐性默契写成显性 SKILL.md，明确触发条件与禁止事项

    3. 存入个人 Skills/Gems 仓库，实战发现新边缘情况就迭代版本号


    推荐装配：自定义 AI Skills / Gems + GitHub 版本化托管

    误用警告：严格遵守“事不过三”，第 3 次重复再动手封装'
