  content: '资源：MVP 极简裁剪刀（sit_prd_01）


    步骤：

    1. 写出脑中完整的理想功能清单

    2. 强制划红线：删掉它后核心价值是否依然成立？能删的全进 V2 冰柜

    3. 把留下的最小闭环压成 1 条主路径，确保 1 个周末内能跑通交付


    交付物：《V1 必做清单（限 3 项）》与《V2 冰柜清单》


    误用警告：裁剪的是锦上添花的功能，不是核心体验的完成度；别把 MVP 做成无法使用的残次品。'
