id: disc_content_distilling_long_reads_into_key_shifts
title: 提炼2-3颠覆点
tagline: 跳过流水账摘要，只挑真正改变你视角的2-3点深聊
routing:
  primitive: compress
  goals:
  - digest
  - create
  clarity_fit:
  - concrete
  domains:
  - content
  - reading_notes
  - distillation
  - insight
  app_affinity:
  - Notion
  - Obsidian
  - ChatGPT
  - Claude
  pain_point: 写书评或读后感时总想把每章每段都列全，结果变成枯燥的 AI 式复述，缺乏个人视角与辨识度
  trigger_utterances:
  - 这篇长文看完了想写读后感但不知道怎么下笔
  - 我的读书笔记太流水账了帮我提炼
  - 写书评是不是要把每章要点都列全
  - 帮我从这篇里挑2个最值得聊的点
  anti_triggers:
  - 需要完整章节摘要的场景
  - 学术文献综述
execution:
  action_type: show_checklist
  inject_mode: null
  content: '1. 明确对象：我刚看完 [一本书/一篇长文/一场分享]，核心内容与印象最深的点是……

    2. 挑出 2 个最值得聊的切角，每个切角需说明：它颠覆了什么旧认知、如何改变你的做法。

    3. 删掉重复概括，只保留最反常识或最能指导行动的洞察。

    4. 用克制语气写成有个人视角的心得大纲，避免面面俱到的流水账。

    5. 自检：若某点 AI 也能生成复述，则删掉，换成只有你读过才有感触的细节。'
  variables: []
  workflow: null
