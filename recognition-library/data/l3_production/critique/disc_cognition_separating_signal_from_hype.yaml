execution:
  action_type: show_checklist
  inject_mode: null
  content: '【3 问挤泡沫清单】

    1. 它吹嘘的理想场景是什么？证据链在哪里（用户、数据、成本）？

    2. 真实落地卡点是什么？成本 / 延迟 / 数据 / 留存 / 集成 / 维护各卡在哪？

    3. 哪些场景用传统简单方案就够了？边界条件是什么？

    输出：值得深入 / 先观察 / 不值得，并给一句理由。'
