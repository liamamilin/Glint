id: manual_875385
title: 主动证伪
tagline: 主动创造使未知错误暴露的条件
routing:
  primitive: critique
  goals:
  - optimize
  clarity_fit:
  - vague
  - concrete
  domains:
  - general
  app_affinity: []
  pain_point: 怀疑对象存在隐蔽问题，却缺乏系统性的检查判据与验证路径
  trigger_utterances:
  - 检查一遍
  - 找找问题
  - 你帮我检查一遍代码
  - 看看这里面有没有什么潜在问题
  - 帮我主动证伪一下这个方案有没有隐蔽漏洞
  - 帮我看下项目代码
  - 帮我看下代码
  anti_triggers:
  - 核实外部新闻、政策公告或文章中陈述性事实的真伪来源（应使用逐条核对说法）
  - 仅润色文案语气或做文字压缩摘要
  - 直接动手修改代码或实施修复（应使用闭环修复）
execution:
  action_type: inject_prompt
  inject_mode: append
  content: 提取对象的预期目标、行为与约束，建立可检验命题。 构造反例、边界条件与失败路径，通过执行、推演或证据追踪验证。 报告问题位置、证据及影响，区分已验证缺陷、潜在风险与未验证区域。 未经授权不得修改对象。
  variables: []
  workflow: null
