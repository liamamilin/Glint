id: core_red_team
title: 红队反方拷问
tagline: 扮演最挑剔的反对者，直接攻击你想法中最脆弱的3个核心假设
routing:
  primitive: critique
  goals:
  - evaluate
  clarity_fit:
  - concrete
  - conflicted
  domains:
  - decision_making
  - risk_analysis
  - strategy
  - product_strategy
  app_affinity:
  - ChatGPT
  - Claude
  - Notion
  - Obsidian
  pain_point: 用户拿出了一个想法或方案，但担心自己被确认偏差蒙蔽、漏掉致命盲区，需要有人尖锐地戳穿最脆弱的假设
  trigger_utterances:
  - 帮我红队一下这个方案
  - 这个想法哪里最脆弱？
  - 别附和我，直接挑刺
  - red team my plan
  - 我是不是漏了什么致命假设
  - 帮我评估一下这个想法靠不靠谱
  - 帮我挑挑这个想法靠不靠谱
  anti_triggers:
  - 用户只是想 brainstorm 更多点子或扩展可能性
  - 用户希望得到鼓励或建设性润色而非攻击
execution:
  action_type: inject_prompt
  inject_mode: append
  content: 请扮演最挑剔的反对者（红队），不要附和，直接逐条攻击我上述想法中最脆弱的 3 个核心假设。对每个假设：1) 指出它为何可能不成立；2) 给出一个让它崩塌的具体反例或失败场景；3) 说明如果它崩塌，对整体方案的连锁影响。最后用一句话总结：这个方案最该先验证的是一件什么事。
  variables: []
  workflow: null
