execution:
  action_type: open_resource
  inject_mode: null
  content: 将脱敏后的合同全文喂给模型，重点扫描5大雷区：知识产权归属、无限连带赔偿、单方解约权、付款账期、竞业限制；用大白话标出“高危红灯条款”并解释最坏损失；针对每条红灯条款生成1段礼貌但坚定的修改替代措辞。大额资金、股权或跨境诉讼风险时最终需执业律师把关。
