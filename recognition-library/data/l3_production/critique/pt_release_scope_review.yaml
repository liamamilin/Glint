id: pt_release_scope_review
title: 发布范围审查
tagline: 对照发布内容与用户路径，标出断点与缺口
routing:
  primitive: critique
  goals:
  - evaluate
  clarity_fit:
  - concrete
  domains:
  - product
  - release_scope
  - user_experience
  - acceptance
  app_affinity:
  - Notion
  - Linear
  pain_point: 发布范围看起来全，但实际用户路径上还有断点，不知道哪些必须补齐、哪些可以带说明交付、哪些要额外验证。
  trigger_utterances:
  - 这个版本范围能覆盖用户目标吗
  - 发布前帮我查漏一下
  - release scope review一下
  - 哪些功能必须补齐才能发
  - 用户路径有没有断点
  anti_triggers:
  - 单纯写发布说明文案
  - 做市场推广方案
execution:
  action_type: inject_prompt
  inject_mode: append
  content: 请对照【计划发布内容】与【目标和用户路径】进行审查。按需求、实现、可观察验收和证据逐项对照，标出用户路径上的断点及受影响用户。最终输出三类清单：1）必须补齐的事项；2）可按说明交付的事项；3）应另做验证的事项。每项注明影响范围与验证方式。
  variables:
  - 计划发布内容
  - 目标和用户路径
  workflow: null
