id: cle_m2_c_p10_assumption_explication
title: 隐含假设显化 (C-P10)
tagline: 未明示前提 → 摊开从材料推到结论所默认的关键前提
routing:
  primitive: critique
  goals:
  - evaluate
  - debug
  clarity_fit:
  - concrete
  - conflicted
  domains:
  - cognition
  - general
  app_affinity: []
  pain_point: 得出了一个看起来顺理成章的结论，但没意识到推理链条里偷偷默认了好几个未验证的前提条件
  trigger_utterances:
  - 我这个结论是从材料怎么推出来的，里面默认了哪些前提假设
  - 帮我把这段推理里没说出口的隐含前提全扒出来
  - 如果哪个默认条件不成立，我的判断哪一步就会崩掉
  - 检查一下我这段话背后偷偷依赖了哪些假设
  anti_triggers: []
execution:
  action_type: inject_prompt
  inject_mode: append
  content: '请帮我把以上判断从“材料 → 结论”推理链中默认的前提假设显化出来：

    1. **还原推理链条**：先简述我依据了什么材料，通过哪几步推导出当前结论。

    2. **逐级拆出默认前提**：对每一步推理指出——要让这一步成立，必须默认关于对象、外部条件或材料可靠性的什么前提？

    3. **写明失效联动**：对每个前提明确说明“如果这条前提不成立，具体哪一步结论必须重审”，并标注哪些需要我确认是原本默认、哪些是这轮新提出来的。


    **检查与边界**：不能只列几个抽象名词（如“口径”“市场”），必须说清它为什么是这一步推理的前提，也不把事后合理化强行说成原本默认。

    *(向内自问备用句：“我的结论怎样从材料推出，其中默认了什么条件？”)*'
  variables: []
  workflow: null
