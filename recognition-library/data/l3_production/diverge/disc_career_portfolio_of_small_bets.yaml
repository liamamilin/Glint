id: disc_career_portfolio_of_small_bets
title: 低成本小实验攒职业期权
tagline: 用业余时间跑低成本小项目，悄悄攒备选路径与作品。
routing:
  primitive: diverge
  goals:
  - create
  - optimize
  clarity_fit:
