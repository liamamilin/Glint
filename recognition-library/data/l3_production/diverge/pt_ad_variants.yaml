  pain_point: 需要为同一产品写出多版广告文案，每版只改变一个主要说服点以便 A/B 测试，但不知道如何结构化变量、卖点与测试指标。
  trigger_utterances:
  - 帮我想几版广告文案做A/B测试
  - 这个产品要跑广告，出几个不同角度的版本
  - 广告文案要测哪个卖点更有效
  - 写几版广告只改一个卖点方便对比
  - 帮我设计广告变体和测试指标
  anti_triggers:
  - 单纯润色单条广告文案
  - 不涉及多版本对比的创意生成
execution:
  action_type: inject_prompt
  inject_mode: append
  content: 为【产品和受众】写【渠道和字数】可用的广告版本。每版只改变一个主要说服点，写标题、正文、行动提示和支撑事实。提出对应测试指标，列任何需审核的声明。
  variables:
  - 产品和受众
  - 渠道和字数
  workflow:
    workflow_id: launch-campaign
    step: 4
    next_lens_id: pt_marketing_report
