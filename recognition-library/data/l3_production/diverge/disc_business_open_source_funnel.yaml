execution:
  action_type: show_checklist
  inject_mode: null
  content: "开源/免费信任漏斗设计清单：\n1. 选定 [目标领域] 的一个真实痛点，做最小可用的免费工具/知识库（足够好用，降低许可门槛）。\n2. 设计 3 条免费→付费衔接路径：\n   - 路径 A：托管/运维托管（免费自托管，付费省掉运维麻烦）。\n\
    \   - 路径 B：定制/咨询服务（免费通用版，付费按场景定制）。\n   - 路径 C：进阶工作流/高级功能（免费基础版，付费解锁效率升级）。\n3. 为每条路径定义清晰的升级触发点与定价锚点。\n4. 分析一个知名开源/免费项目：它如何把零散用户转为付费客户（社区→文档→付费层）。\n\
    5. 将上述拆解映射到你的场景，验证信任信号是否真实可感知。\n6. 检查：免费层是否“足够好用”且付费层是否“省掉麻烦或交付结果”。"
