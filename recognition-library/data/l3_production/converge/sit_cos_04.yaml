  - Notion
  - Obsidian
  - Linear
  - Slack
  pain_point: 在技术选型、定价、合作、域名等决定上反复纠结，几天都拍不了板，把可逆的小事当大事开会研究，时间被空耗
  trigger_utterances:
  - 技术选型 A 和 B 该选哪个纠结好几天了
  - 定价定多少反复改拿不定主意
  - 这个域名/合作要不要签反复犹豫
  - 按钮颜色小事也开会对齐好烦
  - 到底该不该现在做这个决定
  anti_triggers:
  - 按钮颜色、初期文案这类随时可改的小事
  - 需要完整评审的不可逆战略决策
