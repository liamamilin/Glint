  action_type: open_resource
  inject_mode: null
  content: "本地决策日志（Markdown）模板：\n\n# 决策备忘录\n- 决策事项：\n- 门类型：双向门（48h 内可低成本撤回） / 单向门（不可逆）\n- 双向门：设 15 分钟倒计时直接拍板，禁止继续调研\n- 单向门：\n\
    \  - 最坏结果：\n  - 止损底线：\n  - 必须满足的 3 个前提条件：\n- 复盘日期：\n\n极简决策判定 Prompt：先判定该决定是双向门还是单向门；双向门直接拍板，单向门按上表填写后再决定。"
