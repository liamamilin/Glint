id: sit_cos_04
title: 单向门决策矩阵
tagline: 小事秒拍板，大事慢三拍，别在可逆决定上空耗几天
routing:
  primitive: converge
  goals:
  - optimize
  - evaluate
  clarity_fit:
  - concrete
  - conflicted
  domains:
  - decision_making
  - strategy
  - product
