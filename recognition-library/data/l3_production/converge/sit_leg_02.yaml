execution:
  action_type: open_resource
  inject_mode: null
  content: 打开《3 档定价盈亏平衡与毛利测算表》（电子表格/极简计算器），按步骤填写：1) 成本清单：固定成本（工具/域名/订阅）、单用户变动成本（API/支付抽成）、时间机会成本（时薪×预估工时）；2) 定价假设：输入 3 档价格与对应转化率（悲观/基准/乐观），自动计算盈亏平衡所需付费人数=(固定+时间成本)/(价格-变动成本)；3)
    对比毛利与一人产能：薄利多销 vs 高客单小而美，锁定最匹配产能的档位。交付：每档 BEP 人数、毛利率、月收入预测。
  variables: []
  workflow: null
