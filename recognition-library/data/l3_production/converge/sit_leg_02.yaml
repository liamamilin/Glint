  pain_point: 准备给数字产品、订阅或咨询服务定价，在 9 块与 99 块之间举棋不定，算不清回本线和时薪底线
  trigger_utterances:
  - 数字产品卖9块还是99块好
  - 定价总是定太低怎么办
  - 怎么算盈亏平衡点
