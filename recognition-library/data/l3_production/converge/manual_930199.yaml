  - 项目已经发生了很多变化，把相关资料同步一下
  - 更新一下项目文档
  anti_triggers:
  - 从零撰写一篇全新文章、方案或产品文档
  - 仅对单段文字做去 AI 味润色或短摘要
execution:
  action_type: inject_prompt
  inject_mode: append
  content: 以可验证的当前状态为基准，盘点存量信息，识别缺失、过时、重复与冲突。 优先更新、合并已有内容，确立权威来源。 归档失效内容并记录原因及替代关系，修复索引与引用，输出变更清单。 未经授权不得永久删除。
