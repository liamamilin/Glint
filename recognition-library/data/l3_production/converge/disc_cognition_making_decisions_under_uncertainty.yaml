execution:
  action_type: show_checklist
  inject_mode: null
  content: '## 不完全信息下的拍板清单


    - [ ] 写清当前决定一句话：我在 [决定] 上纠结，因为 [简述]

    - [ ] 列出真正关键的 3 个变量（缺一不可的）

    - [ ] 对每个变量判断：当前信息是否已足够（是/否 + 依据）

    - [ ] 明确底线后果：最坏情况是什么，能否承受

    - [ ] 对比「现在就定并边走边调」vs「再等两周调研」的机会成本

    - [ ] 决定：拍板 / 再调研（仅限 1 个最小验证动作）

    - [ ] 记录复盘触发条件：什么信号出现就重新评估'
