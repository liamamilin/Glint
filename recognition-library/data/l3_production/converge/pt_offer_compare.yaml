  pain_point: 同时拿到多个 offer，现金收入、工作内容、成长空间和风险散在各处难以对照，不知道该选哪个。
  trigger_utterances:
  - 这两个 offer 怎么选好纠结
  - A 公司和 B 公司哪个更值得去
  - offer 对比表帮我理一下
  - 现金和成长哪个更重要帮我权衡
  - deadline 快到了还没决定去哪家
  anti_triggers:
