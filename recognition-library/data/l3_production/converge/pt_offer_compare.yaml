  content: 比较【明确写出的机会条件】，我的优先级是【个人偏好与限制】。按职责、成长、工作地点、固定与不确定待遇、决策时限做表，注明假设和出处。把需招聘方书面确认的问题列为下一步。
  variables:
  - 明确写出的机会条件
  - 个人偏好与限制
