execution:
  action_type: show_checklist
  inject_mode: null
  content: '## 停手规则设计清单（Stopping Rule）


    ### 1. 识别死磕场景

    - 我常陷进去停不下来的 task 类型：[查资料 / 改稿 / 调参数 / 挑方案 / 其他]

    - 典型信号：连续 N 轮改动后提升 < X%


    ### 2. 定义 Good Enough to Ship

    - 最低可接受标准（must-have）：____

    - 可延后项（nice-to-have）：____

    - 明确“不做也不影响核心价值”的范围


    ### 3. 设定时间盒 / 止损线

    - 时间盒：最多投入 ____ 小时/天

    - 迭代轮次上限：最多 ____ 版

    - 边际收益阈值：单次改动提升 < ____% 即停


    ### 4. 收尾动作

    - 记录“未完成项 + 下次触发条件”

    - 把剩余精力预算分配给下一局

    - 设定复盘时间点（如 1 周后）


    ### 本周事项应用

    针对：[描述事项]

    - Good Enough 标准：____

    - 止损线：____

    - 下一局精力分配：____'
