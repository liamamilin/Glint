execution:
  action_type: show_checklist
  inject_mode: null
  content: '- [ ] 明确 [你的产品/服务/内容方向] 解决的单一核心痛点与可量化收益

    - [ ] 锁定 3 个痛点极深、人数不多但可直接触达的垂直小圈子

    - [ ] 为每个圈子写出可被验证的成员画像与触达渠道

    - [ ] 设计第一批 10 个种子用户的真诚触达话术（非群发）

    - [ ] 定义前 20 个付费用户的“手动高关怀 + 快速迭代”专属体验

    - [ ] 用深度反馈与转介绍验证口碑复利假设

    - [ ] 仅在 niche 验证通过后再考虑扩展渠道'
