execution:
  action_type: open_resource
  inject_mode: null
  content: 上下文切换熔断器：开工前锁定当前90分钟的唯一虚拟岗位（如只当工程师）；过程中跨岗位灵感/杂念5秒内丢进「暂存收件箱」，绝不顺手切窗口；计时结束后统一分类暂存区，决定丢弃或排入下一个专场。交付：一段无切屏污染的深度产出 +
    一份《暂存灵感队列》。推荐装配：本地极简倒计时 + 一键速记脚本/语音转文字收件箱。误用警告：单次熔断不超过2小时；等待外部紧急响应窗口期勿强行开启。
  variables: []
  workflow: null
