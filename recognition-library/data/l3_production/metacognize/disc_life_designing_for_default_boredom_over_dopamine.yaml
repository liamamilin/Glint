execution:
  action_type: show_checklist
  inject_mode: null
  content: '## 碎片空档审计与轻替代设计


    - [ ] 列出你每天 3~5 个「本来可以放空」的空档（等电梯/通勤/睡前/休息间隙），并记录每个空档通常刷的内容：{{habit}}

    - [ ] 为每个空档设计 1 个不带屏幕输入的轻替代（散步/发呆/观察/呼吸/听无歌词音乐），确保可随手做、不需准备

    - [ ] 选出 3 个最容易落地的替代，写成「空档 → 替代动作」对照表

    - [ ] 选定每天 10 分钟「零信息输入」时段，固定在已有过渡节点（如洗漱后/通勤中），避免新增打卡负担

    - [ ] 为该时段设一条最小规则：不看屏、不记录、不复盘，只允许放空或轻度观察

    - [ ] 一周后回看：是否更松弛/是否出现新想法；若成负担则缩短或换时段'
  variables:
  - habit
  workflow: null
