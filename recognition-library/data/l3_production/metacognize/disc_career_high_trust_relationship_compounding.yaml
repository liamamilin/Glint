execution:
  action_type: show_checklist
  inject_mode: null
  content: '## 靠谱交付·信任复利自检清单


    ### 一、当前承诺进度审计

    - [ ] 列出正在推进的几项合作/承诺（含负责人、截止日期）

    - [ ] 标出进度滞后但尚未主动同步的事项

    - [ ] 为每项滞后事项起草一句真诚、不推卸的提前沟通话术


    ### 二、高信任日常细节（选 3 个落地）

    - [ ] 答应的事在截止日前交付，无法交付时提前 24h+ 说明原因与替代方案

    - [ ] 遇到坑第一时间同步，不等对方追问

    - [ ] 交付物附带“下一步/风险/需要对方配合”的简明说明，减少对方认知负担

    - [ ] 回复消息明确结论与时间点，避免“收到/好的”式空回复

    - [ ] 会议/沟通后 24h 内发出纪要与 action items


    ### 三、破冰追问

    - 我目前在推进的合作有哪些还没主动同步进度？

    - 哪 3 个小细节最能让对方觉得“这人特别靠谱、愿意长期合作”？'
