execution:
  action_type: show_checklist
  inject_mode: null
  content: '## 找到真正的唯一瓶颈 — 诊断清单


    - [ ] 列出整条链路的各环节与当前状态（产出/等待/阻塞）

    - [ ] 标出每个环节的当前吞吐与等待时间

    - [ ] 找出等待最长、吞吐最低的环节 = 真正的最窄瓶颈

    - [ ] 确认：在该瓶颈解除前，其他环节暂不加马力（避免堆积半成品）

    - [ ] 为瓶颈环节设计最小解除动作（一刀）

    - [ ] 列出看起来很忙但不在主瓶颈上的动作，先放一放

    - [ ] 解除后复盘：瓶颈是否转移，循环再诊断'
