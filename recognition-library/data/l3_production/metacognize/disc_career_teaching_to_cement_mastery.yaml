  pain_point: 学了很多概念和资料却以为自己会了，一讲给外行或写教程就卡壳，暴露理解漏洞。
  trigger_utterances:
  - 我学完了这个概念，但讲给别人听就讲不清
  - 收藏了很多资料但感觉没真正掌握
  - 用费曼技巧检验自己是不是真懂
  - 帮我把这段理解改写成小白能懂的解释
  - 我怀疑自己只是死记硬背
  anti_triggers:
  - 需要真正执行代码或操作的场景
  - 已有明确结论只需润色文案的场景
execution:
  action_type: show_checklist
  inject_mode: null
  content: '## 费曼自检清单


    1. 写下你对 [概念/技能] 的当前理解（100~200字，允许有黑话）。

    2. 请 AI 扮演好奇无背景新手，向你提 4 个“为什么/如果……会怎样”问题，逐一作答。

    3. 对每个卡壳点，回到原始资料或动手实验补漏洞，直到能答出。

    4. 把最终理解改写成一段无黑话、带生活类比的 150 字通俗解释。

    5. 把解释发布为公开笔记/教程，作为可复用资产并接受外部反馈。

    6. 一周后不看资料复述一遍，仍能讲清才算真掌握。'
