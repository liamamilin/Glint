  pain_point: 纠结或拿不定主意时总想让 AI 直接给标准答案替自己选，越用越虚，失去对自己选择的掌控感
  trigger_utterances:
  - A 和 B 选哪个，帮我决定一下
  - 我好纠结，AI 你直接告诉我选哪个
  - 这个人生选择我拿不定主意
  - 帮我选一个最好的方案吧
  - 我该不该辞职，AI 给个建议
  anti_triggers:
  - 帮我写个总结或摘要
  - 帮我把项目拆解成步骤清单
execution:
  action_type: show_checklist
  inject_mode: null
  content: '让 AI 做压力测试，而不是替你做决定：

    1. 明确当前纠结的 A vs B 选项及你的顾虑，要求 AI 不替你决定，只分别列出选 A / 选 B 最容易忽略的代价与前提。

    2. 让 AI 提出 3 个直击内心真实偏好与底线的追问，帮自己看清更想要什么。

    3. 对每个选项写出你真正要承担的权重、代价与喜好，确认最终拍板与后果由自己承担。

    4. 只把 AI 当拆盲区、列反方、算代价的工具，拒绝接受“标准答案”式结论。'
