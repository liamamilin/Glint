  pain_point: 明明在推进项目却总觉得被各种'必须这样做'的规矩绑住，说不清哪里不对，想挑明哪些其实是不必遵守的默认设定。
  trigger_utterances:
  - 这个项目我总觉得哪里不对劲但说不清
  - 是不是我默认接受了很多不该接受的规矩
