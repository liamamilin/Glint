execution:
  action_type: show_checklist
  inject_mode: null
  content: '## 揪出隐性合约


    请按以下步骤自检：


    1. 列出你当前推进的 [项目/工作流/生活安排] 现状：[简述现状]

    2. 找出 4 条你默认''签了字''但其实不必遵守的隐性合约

    3. 标出其中最值得立刻打破的一条，并给出打破后的替代做法

    4. 对任一让你感到被绑住的规矩追问：这是真实硬约束，还是习惯成自然的隐性预设？


    常见隐性合约示例：做工具必须通用；产出必须公开发布；遇到问题先找现成方案。'
